<title>DATAGSPORTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #eef2f5;
    --surface: #ffffff;
    --surface-2: #e5ebf0;
    --ink: #0f1720;
    --muted: #566575;
    --border: #d4dce3;
    --grid: #e3e9ee;
    --bar: #c3cdd6;
    --accent: #1f9d5c;
    --accent-ink: #0b7a42;
    --accent-soft: rgba(31, 157, 92, 0.12);
    --neg: #c2413b;
    --neg-soft: rgba(194, 65, 59, 0.12);
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0b0f14;
      --surface: #121822;
      --surface-2: #1a2230;
      --ink: #eef2f6;
      --muted: #8e9bab;
      --border: #26303f;
      --grid: #1d2633;
      --bar: #2c3748;
      --accent: #3ddc84;
      --accent-ink: #3ddc84;
      --accent-soft: rgba(61, 220, 132, 0.12);
      --neg: #f07a72;
      --neg-soft: rgba(240, 122, 114, 0.14);
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0b0f14;
    --surface: #121822;
    --surface-2: #1a2230;
    --ink: #eef2f6;
    --muted: #8e9bab;
    --border: #26303f;
    --grid: #1d2633;
    --bar: #2c3748;
    --accent: #3ddc84;
    --accent-ink: #3ddc84;
    --accent-soft: rgba(61, 220, 132, 0.12);
    --neg: #f07a72;
    --neg-soft: rgba(240, 122, 114, 0.14);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    color-scheme: dark;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: max(16px, 3vw); }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: color-mix(in oklab, var(--ground) 90%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
  .wordmark { font-weight: 700; letter-spacing: -0.02em; font-size: 18px; text-decoration: none; }
  .wordmark b { color: var(--accent-ink); font-weight: 700; }
  .season-chip { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 520px) { .season-chip .asof { display: none; } }

  main { padding-block: 28px 48px; display: flex; flex-direction: column; gap: 36px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  h1 { font-size: 26px; letter-spacing: -0.02em; line-height: 1.2; }
  h2 { font-size: 18px; letter-spacing: -0.01em; }
  h3 { font-size: 15px; }
  p { margin: 0; }
  .lede { color: var(--muted); max-width: 68ch; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }

  /* Inicio */
  .intro { display: flex; flex-direction: column; gap: 14px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-size: 20px; font-weight: 600; }
  .stat span:last-child { font-size: 12px; color: var(--muted); }

  .callout {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    text-decoration: none; background: var(--accent-soft); border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
    border-radius: 12px; padding: 16px 18px;
  }
  .callout:hover { border-color: var(--accent); }
  .callout .eyebrow { color: var(--accent-ink); }
  .callout strong { display: block; font-size: 15px; margin-top: 2px; }
  .callout .go { font-weight: 600; color: var(--accent-ink); white-space: nowrap; }

  .weeks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: thin; }
  .weeks button {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; cursor: pointer; white-space: nowrap;
  }
  .weeks button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }
  .weeks button:hover { color: var(--ink); }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .game {
    display: flex; flex-direction: column; gap: 8px; text-decoration: none; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .game:hover { border-color: var(--muted); }
  .game-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); }
  .team-row { display: grid; grid-template-columns: 10px 38px 1fr auto; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .team-row .abbr { font-weight: 600; font-size: 13px; }
  .team-row .name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-row .num { font-size: 17px; color: var(--muted); }
  .team-row.win .num { color: var(--ink); font-weight: 600; }
  .team-row.loss .abbr { color: var(--muted); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
  .chip b { color: var(--ink); font-weight: 600; }

  .two-col { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.muted { color: var(--muted); }
  td.desc { color: var(--muted); min-width: 240px; max-width: 360px; }

  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 52px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .label { color: var(--muted); }
  .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; background: var(--bar); }
  .fill.score { background: var(--accent); }
  .fill.neg { background: var(--neg); }
  .bar-row .num { text-align: right; font-size: 12px; }

  /* Partido */
  .crumbs a { font-size: 13px; color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--ink); }
  .scoreboard { display: flex; flex-direction: column; gap: 14px; }
  .sb-meta { font-size: 12px; color: var(--muted); }
  .sb-teams { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sb-team { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .sb-team.home { flex-direction: row-reverse; text-align: right; }
  .sb-team .abbr { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sb-team .name { font-size: 12px; color: var(--muted); }
  .sb-team .num { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
  .sb-team.loss .num { color: var(--muted); }
  .sb-team .dot { width: 14px; height: 14px; }
  .sb-final { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  @media (max-width: 520px) {
    .sb-team .num { font-size: 30px; }
    .sb-team .abbr { font-size: 18px; }
    .sb-final { order: 3; width: 100%; text-align: center; }
  }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs a { text-decoration: none; font-size: 13px; font-weight: 500; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs a:hover { color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 20px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .chart-wrap { overflow-x: auto; }
  @media (max-width: 600px) { .chart-wrap .chart { min-width: 600px; } }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .mid { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.7; }
  .chart .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .cross { stroke: var(--ink); stroke-width: 1; opacity: 0.35; }
  .chart .bar { fill: var(--bar); }
  .chart .bar.hl { fill: var(--accent); }
  .chart .bar.hover { opacity: 0.75; }
  .chart .count { fill: var(--ink); font-weight: 500; }
  .readout { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 3em; }
  .readout strong { color: var(--ink); font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); max-width: 72ch; }
  .swing { font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; }
  .swing strong { color: var(--ink); }

  .step { display: flex; flex-direction: column; gap: 10px; }
  .step-num { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); font-weight: 600; }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .metrics div { display: flex; flex-direction: column; }
  .metrics .num { font-size: 18px; font-weight: 600; }
  .metrics span:last-child { font-size: 12px; color: var(--muted); }
  .pos { color: var(--accent-ink); }
  .negv { color: var(--neg); }
  ul.plain { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  .status { color: var(--muted); padding: 24px 0; }
  footer { border-top: 1px solid var(--border); }
  footer .wrap { padding-block: 18px 28px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  .topnav { display: flex; gap: 4px; margin-right: auto; margin-left: 12px; }
  .topnav a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 6px; }
  .topnav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
  .topnav a:hover { color: var(--ink); }
  .callouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }

  .heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; min-width: 620px; }
  .heat th { font-size: 10px; text-transform: none; letter-spacing: 0; padding: 4px; text-align: center; border: 0; line-height: 1.2; }
  .heat th.row { text-align: left; white-space: nowrap; padding-right: 8px; }
  .heat td { border: 0; padding: 7px 4px; text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; border-radius: 4px; color: var(--ink); cursor: default; }
  .heat td.thin { color: var(--muted); font-style: italic; }
  .heat td:hover, .heat td:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .heat tr.down-start th, .heat tr.down-start td { border-top: 6px solid transparent; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .scale i { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in oklab, var(--neg) 45%, var(--surface-2)), var(--surface-2), color-mix(in oklab, var(--accent) 45%, var(--surface-2))); }

  .zones { display: flex; gap: 6px; flex-wrap: wrap; }
  .zones button, .btn {
    font: inherit; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .zones button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }
  .btn.primary { color: var(--ground); background: var(--ink); border-color: var(--ink); font-weight: 600; padding: 6px 14px; }
  .btn.primary:hover { opacity: 0.9; }
  .compare { display: flex; flex-direction: column; gap: 10px; }
  .compare-row { display: grid; grid-template-columns: minmax(120px, 170px) 1fr; gap: 10px; align-items: center; font-size: 13px; }
  .compare-row .label { color: var(--muted); }
  .pair { display: flex; flex-direction: column; gap: 3px; }
  .pair div { display: grid; grid-template-columns: 1fr 46px; gap: 8px; align-items: center; }
  .pair .track { height: 7px; }
  .pair .num { font-size: 11px; text-align: right; }
  .fill.s1 { background: var(--s1); }
  .fill.s2 { background: var(--s2); }
  .trace { margin: 0; padding-left: 18px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); }
  .trace li:last-child { color: var(--ink); font-weight: 600; }
  .chart .s-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .zero { stroke: var(--muted); stroke-width: 1; }
  .chart .end-label { fill: var(--ink); font-family: var(--sans); font-size: 11px; }
  .chart .acc-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  @media (max-width: 520px) { .topnav { margin-left: 4px; } .topnav a { padding: 4px 6px; } }

  @media (prefers-reduced-motion: no-preference) {
    .game, .callout, .weeks button, .tabs a { transition: border-color 120ms ease, color 120ms ease, background-color 120ms ease; }
  }
</style>

<header class="topbar">
  <div class="wrap">
    <a class="wordmark" href="#inicio">DATAG<b>SPORTS</b></a>
    <nav class="topnav" aria-label="Secciones">
      <a href="#inicio" id="nav-home">Partidos</a>
      <a href="#lab" id="nav-lab">Laboratorio</a>
    </nav>
    <span class="season-chip" id="season-chip"></span>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<footer>
  <div class="wrap">
    <span>Datos abiertos de nflverse-data. Foto de la base de datos de DATAGSPORTS — se actualiza cada vez que se vuelve a publicar.</span>
    <span>Herramienta de análisis estadístico: no garantiza resultados.</span>
  </div>
</footer>

<script>
const CORE = /*__CORE_DATA__*/null;

const view = document.getElementById("view");
const numFmt = new Intl.NumberFormat("es-MX");
const dateFmt = new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const weekCache = new Map();
const gamesById = new Map(CORE.games.map((g) => [g.id, g]));
const weeks = [...new Set(CORE.games.map((g) => g.week))].sort((a, b) => a - b);
const featuredGame = CORE.games.filter((g) => g.hs !== null).at(-1);

const POST_LABELS = { WC: "Comodín", DIV: "Divisional", CON: "Campeonato", SB: "Super Bowl" };
const DRIVE_LABELS = {
  "Touchdown": ["Touchdown", "score"],
  "Field goal": ["Gol de campo", "score"],
  "Missed field goal": ["Gol de campo fallado", ""],
  "Punt": ["Despeje (punt)", ""],
  "Turnover": ["Pérdida de balón", "neg"],
  "Turnover on downs": ["Pérdida en 4to down", "neg"],
  "Safety": ["Safety", "neg"],
  "Opp touchdown": ["Touchdown del rival", "neg"],
  "End of half": ["Fin de mitad", ""],
};
const PLAY_TYPE_LABELS = { pass: "Pase", run: "Carrera", punt: "Despeje (punt)", field_goal: "Gol de campo" };

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function fmtDate(iso) {
  return iso ? dateFmt.format(new Date(iso + "T12:00:00Z")) : "";
}
function signed(v, digits = 2) {
  if (v === null || v === undefined) return "—";
  return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(digits);
}
function weekType(week) {
  return CORE.games.find((g) => g.week === week)?.type ?? "REG";
}
function weekLabel(week, short = false) {
  const type = weekType(week);
  if (type !== "REG") return POST_LABELS[type] ?? type;
  return short ? `S${week}` : `Semana ${week}`;
}
function fieldLabel(yl) {
  if (yl === 50) return "Medio campo";
  return yl < 50 ? `Rival ${yl}` : `Propia ${100 - yl}`;
}
function bucketRange(bucket) {
  const lo = bucket * 5 + 1;
  const hi = lo + 4;
  const field = hi <= 50 ? `Rival ${lo}–${hi}` : `Propia ${100 - hi}–${100 - lo}`;
  return { lo, hi, field };
}
function bucketFor(yl) {
  const clamped = Math.min(99, Math.max(1, yl));
  return Math.min(19, Math.floor((clamped - 1) / 5));
}

/* Colores de equipo legibles sobre la superficie del tema actual */
function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const n = parseInt(full, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function luminance([r, g, b]) {
  const f = (c) => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function contrast(a, b) {
  const [l1, l2] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (l1 + 0.05) / (l2 + 0.05);
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function rgbToHex(rgb) {
  return "#" + rgb.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
}
function teamColors(homeAbbr, awayAbbr) {
  const surface = hexToRgb(cssVar("--surface") || "#ffffff");
  const fallback = cssVar("--muted") || "#8e9bab";
  // Si el color del equipo no contrasta con la superficie, se aclara (tema
  // oscuro) u oscurece (tema claro) el mismo tono en vez de cambiar de color.
  const target = luminance(surface) < 0.5 ? [255, 255, 255] : [0, 0, 0];
  const legible = (hex) => {
    const base = hexToRgb(hex);
    for (let t = 0; t <= 0.6001; t += 0.1) {
      const rgb = base.map((v, i) => v + (target[i] - v) * t);
      if (contrast(rgb, surface) >= 3) return rgb;
    }
    return null;
  };
  const pick = (abbr, avoid) => {
    const t = CORE.teams[abbr] ?? {};
    for (const c of [t.c1, t.c2]) {
      if (!c || !/^#[0-9a-f]{3,6}$/i.test(c)) continue;
      const rgb = legible(c);
      if (!rgb) continue;
      if (avoid) {
        const a = hexToRgb(avoid);
        if (Math.hypot(rgb[0] - a[0], rgb[1] - a[1], rgb[2] - a[2]) < 90) continue;
      }
      return rgbToHex(rgb);
    }
    return fallback;
  };
  const home = pick(homeAbbr);
  const away = pick(awayAbbr, home);
  return { home, away };
}

function spreadInfo(g) {
  if (g.spread === null || g.spread === undefined) return null;
  const fav = g.spread > 0 ? g.home : g.spread < 0 ? g.away : null;
  const line = fav ? `${fav} −${Math.abs(g.spread)}` : "Pick'em";
  let cover = null;
  if (g.hs !== null && g.as !== null) {
    const margin = g.hs - g.as;
    cover = margin > g.spread ? `cubrió ${g.home}` : margin < g.spread ? `cubrió ${g.away}` : "push";
  }
  return { line, cover };
}
function totalInfo(g) {
  if (g.total === null || g.total === undefined) return null;
  let result = null;
  if (g.hs !== null && g.as !== null) {
    const pts = g.hs + g.as;
    result = pts > g.total ? `Over (${pts})` : pts < g.total ? `Under (${pts})` : `push (${pts})`;
  }
  return { line: `O/U ${g.total}`, result };
}

  const res = await fetch(`data/week-${String(week).padStart(2, "0")}.json`);

  const data = await res.json();
  weekCache.set(week, data);
  return data;
}

function clockLabel(row) {
  const [elapsed, quarter] = row;
  const q = quarter ?? Math.min(4, Math.floor(elapsed / 900) + 1);
  const left = Math.max(0, q <= 4 ? q * 900 - elapsed : 3600 + 600 * (q - 4) - elapsed);
  const mm = Math.floor(left / 60);
  const ss = String(Math.round(left % 60)).padStart(2, "0");
  return `${q >= 5 ? "TE" : "Q" + q} · ${mm}:${ss}`;
}

function wpChart(g, rows, colors) {
  const W = 720, H = 250, L = 64, R = 12, T = 14, B = 26;
  const PW = W - L - R, PH = H - T - B;
  const maxE = Math.max(3600, ...rows.map((r) => r[0]));
  const x = (e) => L + (e / maxE) * PW;
  const y = (p) => T + (1 - p) * PH;
  const pts = rows.map((r) => [x(r[0]), y(r[2])]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${pts.at(-1)[0].toFixed(1)} ${y(0.5)} L${pts[0][0].toFixed(1)} ${y(0.5)} Z`;
  const quarterLines = [900, 1800, 2700, 3600].filter((s) => s < maxE);
  const periods = [[0, "Q1"], [900, "Q2"], [1800, "Q3"], [2700, "Q4"]];
  if (maxE > 3600) periods.push([3600, "TE"]);

  let swingIdx = -1, swing = 0;
  for (let i = 1; i < rows.length; i++) {
    const d = rows[i][2] - rows[i - 1][2];
    if (Math.abs(d) > Math.abs(swing)) { swing = d; swingIdx = i; }
  }
  const last = pts.at(-1);

  const svg = `
    <svg class="chart" id="wp-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Probabilidad de victoria de ${esc(g.home)} durante el partido: empieza en ${Math.round(rows[0][2] * 100)}% y termina en ${Math.round(rows.at(-1)[2] * 100)}%">
      <defs>
        <clipPath id="wp-above"><rect x="${L}" y="${T}" width="${PW}" height="${PH / 2}"/></clipPath>
        <clipPath id="wp-below"><rect x="${L}" y="${T + PH / 2}" width="${PW}" height="${PH / 2}"/></clipPath>
      </defs>
      <line class="grid" x1="${L}" y1="${y(1)}" x2="${W - R}" y2="${y(1)}"/>
      <line class="grid" x1="${L}" y1="${y(0)}" x2="${W - R}" y2="${y(0)}"/>
      ${quarterLines.map((s) => `<line class="grid" x1="${x(s)}" y1="${T}" x2="${x(s)}" y2="${T + PH}"/>`).join("")}
      <path d="${area}" fill="${esc(colors.home)}" fill-opacity="0.28" clip-path="url(#wp-above)"/>
      <path d="${area}" fill="${esc(colors.away)}" fill-opacity="0.28" clip-path="url(#wp-below)"/>
      <line class="mid" x1="${L}" y1="${y(0.5)}" x2="${W - R}" y2="${y(0.5)}"/>
      <path class="line" d="${line}"/>
      ${swingIdx > 0 ? `<circle cx="${pts[swingIdx][0].toFixed(1)}" cy="${pts[swingIdx][1].toFixed(1)}" r="6" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ""}
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${L - 8}" y="${y(1) + 4}" text-anchor="end">${esc(g.home)} 100%</text>
      <text x="${L - 8}" y="${y(0.5) + 4}" text-anchor="end">50%</text>
      <text x="${L - 8}" y="${y(0) + 4}" text-anchor="end">${esc(g.away)} 100%</text>
      ${periods.map(([s, label]) => `<text x="${x(s) + 4}" y="${H - 8}">${label}</text>`).join("")}
      <line class="cross" id="wp-cross" x1="0" y1="${T}" x2="0" y2="${T + PH}" visibility="hidden"/>
      <circle id="wp-dot" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      <rect id="wp-hit" x="${L}" y="${T}" width="${PW}" height="${PH}" fill="transparent"/>
    </svg>`;

  const swingText = swingIdx > 0
    ? `<p class="swing"><strong>Jugada de mayor impacto</strong> (${esc(clockLabel(rows[swingIdx]))}): la probabilidad de ${esc(swing > 0 ? g.home : g.away)} subió ${Math.round(Math.abs(swing) * 100)} puntos. ${esc(rows[swingIdx][3] ?? "")}</p>`
    : "";
  return { svg, swingText, geometry: { L, PW, maxE, x, y } };
}

function attachWpHover(g, rows, geometry) {
  const svg = document.getElementById("wp-chart");
  const hit = document.getElementById("wp-hit");
  const cross = document.getElementById("wp-cross");
  const dot = document.getElementById("wp-dot");
  const readout = document.getElementById("wp-readout");
  if (!svg || !hit) return;
  const defaultText = readout.innerHTML;
  const show = (evt) => {
    const box = svg.getBoundingClientRect();
    const svgX = ((evt.clientX - box.left) / box.width) * 720;
    const e = ((svgX - geometry.L) / geometry.PW) * geometry.maxE;
    let lo = 0, hi = rows.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (rows[mid][0] < e) lo = mid + 1; else hi = mid;
    }
    const i = lo > 0 && Math.abs(rows[lo - 1][0] - e) < Math.abs(rows[lo][0] - e) ? lo - 1 : lo;
    const r = rows[i];
    const px = geometry.x(r[0]), py = geometry.y(r[2]);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    const leader = r[2] >= 0.5 ? g.home : g.away;
    const pct = Math.round((r[2] >= 0.5 ? r[2] : 1 - r[2]) * 100);
    readout.innerHTML = `<strong>${esc(clockLabel(r))} · ${esc(leader)} ${pct}% de ganar</strong><br>${esc(r[3] ?? "")}`;
  };
  const hide = () => {
    cross.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden");
    readout.innerHTML = defaultText;
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}

function epChart(highlightCounts) {

  const bars = CORE.epModel.map((b) => {
    if (b.ep === null) return "";
    const x0 = xOf(b.bucket * 5 + 5) + 1;
    const x1 = xOf(b.bucket * 5) - 1;
    const hl = highlightCounts.get(b.bucket) ?? 0;

    const cx = (x0 + x1) / 2;
    return `
      <rect class="bar ${hl ? "hl" : ""}" data-bucket="${b.bucket}" x="${x0.toFixed(1)}" y="${top.toFixed(1)}" width="${(x1 - x0).toFixed(1)}" height="${(base - top).toFixed(1)}" rx="3"/>
      ${hl ? `<text class="count" x="${cx.toFixed(1)}" y="${(top - 6).toFixed(1)}" text-anchor="middle">×${hl}</text>` : ""}
      <rect class="ep-hit" data-bucket="${b.bucket}" x="${(x0 - 1).toFixed(1)}" y="${T}" width="${(x1 - x0 + 2).toFixed(1)}" height="${PH}" fill="transparent"/>`;
  }).join("");
  const ticks = [0, 1, 2, 3, 4, 5, 6, 7].map((v) => `
    <line class="grid" x1="${L}" y1="${yOf(v)}" x2="${W - R}" y2="${yOf(v)}"/>
    <text x="${L - 8}" y="${yOf(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const fieldTicks = [[100, "Tu gol", "start"], [75, "Propia 25", "middle"], [50, "50", "middle"], [25, "Rival 25", "middle"], [0, "Gol rival", "end"]]
    .map(([yl, label, anchor]) => `<text x="${xOf(yl)}" y="${H - 22}" text-anchor="${anchor}">${label}</text>`).join("");
  return `
    <svg class="chart" id="ep-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos esperados en 1er down según la posición en el campo">

function pearson(xs, ys) {
  const n = xs.length;
  if (n < 3) return null;
  const mx = xs.reduce((s, v) => s + v, 0) / n;
  const my = ys.reduce((s, v) => s + v, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
  }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}

  });
  const paired = rows.filter((r) => r[6] !== null && r[7] !== null);
  const r = pearson(paired.map((p) => p[6]), paired.map((p) => p[7]));
  const mae = paired.length ? paired.reduce((s, p) => s + Math.abs(p[6] - p[7]), 0) / paired.length : null;
  const sameSign = paired.length ? paired.filter((p) => Math.sign(p[6]) === Math.sign(p[7])).length / paired.length : null;
  const season = CORE.epCompare;
  const totalFirstDowns = CORE.epModel.reduce((s, b) => s + b.n, 0);
  const epNear = CORE.epModel[0]?.ep, epFar = CORE.epModel[19]?.ep;

  body.innerHTML = `
    <div class="stack">
      <section class="panel step">
        <span class="step-num">Paso 1 de 4</span>
        <h2>Qué estamos construyendo</h2>
        <p class="lede">El framework define los Puntos Esperados (EP) como la función de valor de una cadena de Markov sobre el estado <code>(down, distancia, yardas, tiempo)</code>. Aquí construimos la versión más simple posible, con datos reales: todas las jugadas de <strong>1er down</strong> de la temporada ${CORE.season}, agrupadas por posición del balón, promediando cuántos puntos anotó el equipo con el balón antes de que terminara esa posesión.</p>
        <p class="note">Valores por resultado de la posesión: touchdown 6.94 (7 menos los puntos extra fallados), gol de campo 3, safety −2, touchdown del rival −6.94, cualquier otro final 0.</p>
      </section>

      <section class="panel step">
        <span class="step-num">Paso 2 de 4</span>
        <h2>El modelo, calculado sobre toda la temporada</h2>
        <p class="lede">${numFmt.format(totalFirstDowns)} jugadas de 1er down en 20 tramos de 5 yardas. Las barras verdes son tramos donde <strong>${esc(g.away)} @ ${esc(g.home)}</strong> tuvo jugadas de 1er down (×n = cuántas).</p>
        <div class="chart-wrap">${epChart(highlightCounts)}</div>
        <p class="readout" id="ep-readout">Pasa el cursor (o toca) sobre una barra para ver su tramo, su EP y cuántas jugadas lo sostienen.</p>
        <p class="note">La curva tiene la forma esperada: ${epNear?.toFixed(1)} puntos a 1–5 yardas del gol rival y ${epFar?.toFixed(1)} pegado a tu propia zona. No baja de cero porque esta versión no le da valor al rival cuando pierdes el balón; el modelo de nflverse sí.</p>
      </section>

      <section class="panel step">
        <span class="step-num">Paso 3 de 4</span>
        <h2>Nuestro EPA contra el de nflverse</h2>
        <p class="lede">Para cada 1er down del partido: <code>EPA propio = EP(después) − EP(antes)</code> leído de la curva, junto al <code>epa</code> profesional de la misma jugada.</p>
        <div class="metrics">
          <div><span class="num">${paired.length}</span><span>jugadas comparadas</span></div>
          <div><span class="num">${r === null ? "—" : r.toFixed(2)}</span><span>correlación (r) en este partido</span></div>
          <div><span class="num">${mae === null ? "—" : mae.toFixed(2)}</span><span>diferencia media (puntos)</span></div>
          <div><span class="num">${sameSign === null ? "—" : Math.round(sameSign * 100) + "%"}</span><span>mismo signo</span></div>
          ${season && season.r !== null ? `<div><span class="num">${season.r.toFixed(2)}</span><span>correlación en toda ${CORE.season} (${numFmt.format(season.n)} jugadas)</span></div>` : ""}
          ${data.v2 && data.v2.r !== null ? `<div><span class="num pos">${data.v2.r.toFixed(2)}</span><span>con el modelo v2 de 4 downs, en este partido (${data.v2.n} jugadas)</span></div>` : ""}
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Q</th><th>Equipo</th><th>Posición</th><th>Jugada</th><th class="r">EP antes</th><th class="r">EP después</th><th class="r">EPA propio</th><th class="r">EPA nflverse</th></tr></thead>
            <tbody>
              ${rows.map((p) => `
                <tr>
                  <td class="muted num">${p[0] ?? "–"}</td>
                  <td>${esc(p[1] ?? "–")}</td>
                  <td class="muted num" style="white-space:nowrap">${p[2] !== null ? esc(fieldLabel(p[2])) : "–"}</td>
                  <td class="desc">${esc(p[3] ?? "")}</td>
                  <td class="r num muted">${p[4] === null ? "–" : p[4].toFixed(2)}</td>
                  <td class="r num muted">${p[5] === null ? "–" : p[5].toFixed(2)}</td>
                  <td class="r num ${p[6] > 0 ? "pos" : p[6] < 0 ? "negv" : ""}">${signed(p[6])}</td>
                  <td class="r num ${p[7] > 0 ? "pos" : p[7] < 0 ? "negv" : ""}">${signed(p[7])}</td>
                </tr>`).join("")}
            </tbody>

          <li>No le asigna valor al rival cuando se pierde el balón (la metodología "next score").</li>

        </ul>
        <p class="note">El siguiente paso ya está construido: la cadena de Markov con los 4 downs, resuelta por iteración de valor, y un simulador de posesiones completas. <a href="#lab">Abrir el laboratorio →</a></p>

  attachEpHover(highlightCounts);
}

/* ---------- Laboratorio: cadena de Markov ---------- */
const DOWN_NAMES = ["1ro", "2do", "3ro", "4to"];
const DIST_NAMES = ["1–3", "4–6", "7–10", "11+"];
const OUT = { YARDS: 0, TD: 1, TURNOVER: 2, PUNT: 3, FG_MADE: 4, FG_MISSED: 5 };
const EP_SERIES = [
  { down: 1, dist: 2, label: "1ro y 10", color: "var(--s1)" },
  { down: 2, dist: 1, label: "2do y 4–6", color: "var(--s2)" },
  { down: 3, dist: 1, label: "3ro y 4–6", color: "var(--s3)" },
  { down: 4, dist: 0, label: "4to y 1–3", color: "var(--s4)" },
];
let labData = null;
let labZone = 7;

async function loadLab() {
  if (labData) return labData;
  const res = await fetch("data/lab.json");
  if (!res.ok) throw new Error(String(res.status));
  labData = await res.json();
  return labData;
}
const sIdx = (down, dist, zone) => ((down - 1) * 4 + dist) * 10 + zone;
const distOf = (ytg) => (ytg <= 3 ? 0 : ytg <= 6 ? 1 : ytg <= 10 ? 2 : 3);
const zoneOf = (yl) => Math.min(9, Math.max(0, Math.floor((Math.min(99, Math.max(1, yl)) - 1) / 10)));
function zoneLabel(z) {
  const lo = 10 * z + 1, hi = 10 * z + 10;
  return hi <= 50 ? `Rival ${lo}–${hi}` : `Propia ${Math.max(1, 100 - hi)}–${100 - lo}`;
}
const ZONES_LTR = [9, 8, 7, 6, 5, 4, 3, 2, 1, 0];

function heatmap(lab) {
  const maxAbs = Math.max(...lab.ep.map((v) => Math.abs(v)));
  const head = ZONES_LTR.map((z) => {
    const [side, range] = zoneLabel(z).split(" ");
    return `<th scope="col">${side}<br>${range}</th>`;
  }).join("");
  let body = "";
  for (let d = 1; d <= 4; d++) {
    for (let dist = 0; dist < 4; dist++) {
      const cells = ZONES_LTR.map((z) => {
        const i = sIdx(d, dist, z);
        const v = lab.ep[i];
        const pct = Math.round(Math.min(1, Math.abs(v) / maxAbs) * 45);
        const pole = v >= 0 ? "var(--accent)" : "var(--neg)";
        return `<td tabindex="0" data-i="${i}" class="${lab.n[i] < 20 ? "thin" : ""}" style="background:color-mix(in oklab, ${pole} ${pct}%, var(--surface-2))">${signed(v, 1)}</td>`;
      }).join("");
      body += `<tr class="${dist === 0 && d > 1 ? "down-start" : ""}"><th class="row" scope="row">${DOWN_NAMES[d - 1]} y ${DIST_NAMES[dist]}</th>${cells}</tr>`;
    }
  }
  return `<div class="table-scroll"><table class="heat" id="heat"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function attachHeatHover(lab) {
  const readout = document.getElementById("heat-readout");
  const defaultText = readout.innerHTML;
  document.querySelectorAll("#heat td").forEach((cell) => {
    const i = Number(cell.dataset.i);
    const zone = i % 10;
    const dist = Math.floor(i / 10) % 4;
    const down = Math.floor(i / 40) + 1;
    const show = () => {
      readout.innerHTML = `<strong>${DOWN_NAMES[down - 1]} y ${DIST_NAMES[dist]} en ${zoneLabel(zone)}: EP ${signed(lab.ep[i], 2)} puntos</strong><br>${numFmt.format(lab.n[i])} jugadas reales en este estado${lab.n[i] < 20 ? " — pocas, así que el valor se apoya en el promedio de su down y zona (shrinkage, sección 5.7.4)" : ""}.`;
    };
    cell.addEventListener("pointerenter", show);
    cell.addEventListener("focus", show);
    cell.addEventListener("pointerleave", () => { readout.innerHTML = defaultText; });
    cell.addEventListener("blur", () => { readout.innerHTML = defaultText; });
  });
}

function convergenceChart(iters) {
  const W = 720, H = 210, L = 52, R = 16, T = 14, B = 30;
  const PW = W - L - R, PH = H - T - B;
  const logMin = -3.5, logMax = 1;
  const x = (i) => L + (i / Math.max(1, iters.length - 1)) * PW;
  const y = (v) => T + ((logMax - Math.log10(Math.max(v, 10 ** logMin))) / (logMax - logMin)) * PH;
  const path = iters.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const yTicks = [[10, "10"], [1, "1"], [0.1, "0.1"], [0.01, "0.01"], [0.001, "0.001"]];
  const xTicks = [];
  for (let i = 0; i < iters.length; i += 25) xTicks.push(i);
  if (xTicks.at(-1) !== iters.length - 1) xTicks.push(iters.length - 1);
  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cambio máximo de EP por iteración: de ${iters[0].toFixed(2)} a ${iters.at(-1).toFixed(4)} puntos en ${iters.length} iteraciones">
      ${yTicks.map(([v, t]) => `<line class="grid" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${t}</text>`).join("")}
      <line class="mid" x1="${L}" y1="${y(0.001)}" x2="${W - R}" y2="${y(0.001)}"/>
      <text x="${W - R}" y="${y(0.001) - 6}" text-anchor="end">criterio de parada: 0.001</text>
      <path class="acc-line" d="${path}"/>
      <circle cx="${x(iters.length - 1)}" cy="${y(iters.at(-1))}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      ${xTicks.map((i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`).join("")}
    </svg>`;
}

function epByDownChart(lab) {
  const W = 720, H = 280, L = 34, R = 92, T = 16, B = 42;
  const PW = W - L - R, PH = H - T - B;
  const values = EP_SERIES.flatMap((s) => ZONES_LTR.map((z) => lab.ep[sIdx(s.down, s.dist, z)]));
  const yMin = Math.floor(Math.min(0, ...values)), yMax = Math.ceil(Math.max(...values));
  const x = (col) => L + ((col + 0.5) / 10) * PW;
  const y = (v) => T + ((yMax - v) / (yMax - yMin)) * PH;
  const ticks = [];
  for (let v = yMin; v <= yMax; v++) ticks.push(v);
  const lines = EP_SERIES.map((s) => {
    const pts = ZONES_LTR.map((z, col) => [x(col), y(lab.ep[sIdx(s.down, s.dist, z)])]);
    const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
    return `<path class="s-line" d="${d}" style="stroke:${s.color}"/>${pts.map((p) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" style="fill:${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("")}`;
  }).join("");
  // Etiquetas directas al final de cada línea, separadas para que no se encimen.
  const ends = EP_SERIES.map((s) => ({ s, y: y(lab.ep[sIdx(s.down, s.dist, 0)]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  const labels = ends.map((e) => `<text class="end-label" x="${x(9) + 12}" y="${e.y + 4}">${e.s.label}</text>`).join("");
  const xLabels = [[0, "Propia 1–9"], [2, "Propia 20–29"], [4.5, "50"], [7, "Rival 21–30"], [9, "Rival 1–10"]]
    .map(([col, t]) => `<text x="${x(col)}" y="${H - 22}" text-anchor="middle">${t}</text>`).join("");
  const hits = ZONES_LTR.map((z, col) => `<rect class="ep2-hit" data-zone="${z}" data-col="${col}" x="${(L + (col / 10) * PW).toFixed(1)}" y="${T}" width="${(PW / 10).toFixed(1)}" height="${PH}" fill="transparent"/>`).join("");
  return `
    <svg class="chart" id="ep2-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos esperados por posición del balón para cuatro situaciones de down y distancia">
      ${ticks.map((v) => `<line class="${v === 0 ? "zero" : "grid"}" x1="${L}" y1="${y(v)}" x2="${L + PW}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
      <line class="cross" id="ep2-cross" x1="0" y1="${T}" x2="0" y2="${T + PH}" visibility="hidden"/>
      ${lines}
      ${labels}
      ${xLabels}
      <text x="${L + PW / 2}" y="${H - 4}" text-anchor="middle">posición del balón → dirección de ataque</text>
      ${hits}
    </svg>`;
}

function attachEpByDownHover(lab) {
  const readout = document.getElementById("ep2-readout");
  const cross = document.getElementById("ep2-cross");
  const defaultText = readout.innerHTML;
  document.querySelectorAll("#ep2-chart .ep2-hit").forEach((hit) => {
    const z = Number(hit.dataset.zone);
    const cx = Number(hit.getAttribute("x")) + Number(hit.getAttribute("width")) / 2;
    const show = () => {
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
      readout.innerHTML = `<strong>${zoneLabel(z)}</strong><br>` + EP_SERIES.map((s) => `${s.label}: <span class="num">${signed(lab.ep[sIdx(s.down, s.dist, z)], 2)}</span>`).join(" · ");
    };
    hit.addEventListener("pointerenter", show);
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); readout.innerHTML = defaultText; });
  });
}

function simulateDrive(trans, start, trace) {
  let { down, ytg, yl } = start;
  const steps = [];
  const where = () => `${DOWN_NAMES[down - 1]} y ${ytg >= yl ? "gol" : ytg} en ${fieldLabel(yl)}`;
  const end = (result, points, text) => {
    if (trace && text) steps.push(text);
    return { result, points, steps };
  };
  for (let step = 0; step < 40; step++) {
    const t = trans[sIdx(down, distOf(ytg), zoneOf(yl))];
    if (!t || t[1].length === 0) return end("Punt", 0, `${where()} → despeje`);
    const k = Math.floor(Math.random() * t[1].length);
    const code = t[1][k];
    if (code === OUT.TD) return end("Touchdown", 6.94, `${where()} → touchdown`);
    if (code === OUT.TURNOVER) return end("Turnover", 0, `${where()} → pérdida de balón`);
    if (code === OUT.PUNT) return end("Punt", 0, `${where()} → despeje (punt)`);
    if (code === OUT.FG_MADE) return end("Field goal", 3, `${where()} → gol de campo bueno`);
    if (code === OUT.FG_MISSED) return end("Missed field goal", 0, `${where()} → gol de campo fallado`);
    const gain = t[0][k];
    if (trace) steps.push(`${where()} → ${gain >= 0 ? "+" : "−"}${Math.abs(gain)} yardas`);
    yl -= gain;
    if (yl <= 0) return end("Touchdown", 6.94, "Touchdown");
    if (yl >= 100) return end("Safety", -2, "Safety");
    if (gain >= ytg) { down = 1; ytg = Math.min(10, yl); }
    else {
      down += 1; ytg -= gain;
      if (down > 4) return end("Turnover on downs", 0, "Pérdida en 4to down");
    }
  }
  return end("End of half", 0, "Fin de mitad");
}

function runSimulation(lab) {
  const N = 10000;
  const yl = 10 * labZone + 5;
  const start = { down: 1, ytg: Math.min(10, yl), yl };
  const counts = {};
  let pts = 0;
  for (let i = 0; i < N; i++) {
    const r = simulateDrive(lab.transitions, start, false);
    counts[r.result] = (counts[r.result] ?? 0) + 1;
    pts += r.points;
  }
  const trace = simulateDrive(lab.transitions, start, true);
  const real = lab.driveStarts[labZone];
  const realPts = real.n ? real.points / real.n : null;
  const cats = [...new Set([...Object.keys(real.results), ...Object.keys(counts)])]
    .sort((a, b) => ((real.results[b] ?? 0) / (real.n || 1) + (counts[b] ?? 0) / N) - ((real.results[a] ?? 0) / (real.n || 1) + (counts[a] ?? 0) / N));
  const maxShare = Math.max(...cats.map((c) => Math.max((counts[c] ?? 0) / N, real.n ? (real.results[c] ?? 0) / real.n : 0)));
  const bar = (share, cls) => `<div><div class="track"><div class="fill ${cls}" style="width:${((share / maxShare) * 100).toFixed(1)}%"></div></div><span class="num">${(share * 100).toFixed(1)}%</span></div>`;
  const endHalf = real.n ? (real.results["End of half"] ?? 0) / real.n : 0;
  const diff = realPts === null ? null : pts / N - realPts;

  document.getElementById("sim-out").innerHTML = `
    <div class="metrics">
      <div><span class="num">${(pts / N).toFixed(2)}</span><span>puntos por posesión, simulados (${numFmt.format(N)})</span></div>
      <div><span class="num">${realPts === null ? "—" : realPts.toFixed(2)}</span><span>puntos por posesión reales (${numFmt.format(real.n)} posesiones)</span></div>
      <div><span class="num ${diff > 0 ? "negv" : "pos"}">${diff === null ? "—" : signed(diff)}</span><span>diferencia del simulador</span></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--s1)"></i>Simulado</span>
      <span><i class="dot" style="background:var(--s2)"></i>Real ${CORE.season}</span>
    </div>
    <div class="compare">
      ${cats.map((c) => `
        <div class="compare-row">
          <span class="label">${esc((DRIVE_LABELS[c] ?? [c])[0])}</span>
          <div class="pair">${bar((counts[c] ?? 0) / N, "s1")}${bar(real.n ? (real.results[c] ?? 0) / real.n : 0, "s2")}</div>
        </div>`).join("")}
    </div>
    <div>
      <h3 style="margin-bottom:6px">Una de esas posesiones, jugada por jugada</h3>
      <ol class="trace">${trace.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    </div>
    <p class="note">Por qué no coinciden del todo: el simulador no tiene reloj, así que una posesión nunca termina por fin de mitad (en los datos reales eso le pasó al ${(endHalf * 100).toFixed(0)}% de las posesiones que empezaron aquí) ni por touchdown del rival. Ese es el componente semi-Markov del framework (sección 5.4.1): agregar el tiempo restante al estado.</p>`;
}

async function renderLab() {
  const token = ++renderToken;
  view.innerHTML = `<p class="status">Cargando el laboratorio…</p>`;
  let lab;
  try { lab = await loadLab(); } catch (err) {
    if (token === renderToken) view.innerHTML = `<p class="status">No se pudo cargar el laboratorio. Recarga la página para intentarlo de nuevo.</p>`;
    return;
  }
  if (token !== renderToken) return;
  const thin = lab.n.filter((v) => v < 20).length;
  const totalStatePlays = lab.n.reduce((s, v) => s + v, 0);
  const v1 = CORE.epCompare, v2 = CORE.markov;

  view.innerHTML = `
    <section class="intro">
      <p class="eyebrow">Laboratorio · modelo v2</p>
      <h1>La cadena de Markov completa</h1>
      <p class="lede">El modelo simple solo miraba la yarda del 1er down. Aquí el estado es <code>(down, distancia, zona del campo)</code>: 160 estados, sus valores resueltos por iteración de valor sobre las ${numFmt.format(CORE.counts.drives)} posesiones de ${CORE.season}, y un simulador que recorre la cadena jugada por jugada.</p>
    </section>

    <section class="panel step">
      <span class="step-num">Paso 1 de 5</span>
      <h2>El espacio de estados</h2>
      <p class="lede">4 downs × 4 distancias × 10 zonas de 10 yardas. Cada celda es el EP de ese estado: los puntos netos que el equipo con el balón espera, descontando lo que el rival espera anotar después. ${numFmt.format(totalStatePlays)} jugadas reales los sostienen; ${thin} estados tienen menos de 20 (en cursiva) y se apoyan en su down y zona.</p>
      <div class="scale"><span>Rival favorecido</span><i></i><span>Ofensiva favorecida</span></div>
      ${heatmap(lab)}
      <p class="readout" id="heat-readout">Pasa el cursor (o toca) sobre una celda para ver el estado y cuántas jugadas lo respaldan.</p>
    </section>

    <section class="panel step">
      <span class="step-num">Paso 2 de 5</span>
      <h2>Iteración de valor: cómo se resuelve</h2>
      <p class="lede">El valor de un estado depende del valor del estado donde el rival recibe el balón, que a su vez depende de otros estados. Por eso no se calcula de una vez: se parte de EP = 0 y se repite <code>EP(s) ← promedio[ puntos de la posesión − EP(rival al recibir) ]</code> hasta que ningún estado cambie más de 0.001 puntos.</p>
      <div class="chart-wrap">${convergenceChart(lab.iterations)}</div>
      <p class="note">${lab.iterations.length} iteraciones: el cambio máximo baja de ${lab.iterations[0].toFixed(2)} a ${lab.iterations.at(-1).toFixed(4)} puntos. La caída es geométrica, la señal de que la cadena converge a un valor único.</p>
    </section>

    <section class="panel step">
      <span class="step-num">Paso 3 de 5</span>
      <h2>Lo que el modelo aprendió</h2>
      <p class="lede">EP por posición del balón en cuatro situaciones. El down pesa tanto como la yarda: un 4to y corto en tu propia zona vale menos que cero, porque perder el balón ahí regala puntos.</p>
      <div class="legend">${EP_SERIES.map((s) => `<span><i class="dot" style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>
      <div class="chart-wrap">${epByDownChart(lab)}</div>
      <p class="readout" id="ep2-readout">Pasa el cursor (o toca) sobre una zona para comparar las cuatro situaciones.</p>
    </section>

    <section class="panel step">
      <span class="step-num">Paso 4 de 5</span>
      <h2>Validación contra el modelo profesional</h2>
      <p class="lede">Mismo ejercicio que en el modelo simple: EPA propio de cada jugada comparado con el <code>epa</code> de nflverse, ahora en todos los downs.</p>
      <div class="metrics">
        ${v1 ? `<div><span class="num">${v1.r.toFixed(2)}</span><span>modelo v1 · solo 1er down (${numFmt.format(v1.n)} jugadas)</span></div>` : ""}
        ${v2 ? `<div><span class="num pos">${v2.r.toFixed(2)}</span><span>modelo v2 · cadena completa (${numFmt.format(v2.n)} jugadas)</span></div>` : ""}
        ${v2 ? `<div><span class="num">${v2.mae.toFixed(2)}</span><span>diferencia media v2 (puntos por jugada)</span></div>` : ""}
      </div>
      <p class="note">Lo que cerró la brecha: distinguir los 4 downs y la distancia, y darle valor negativo a entregar el balón. Lo que falta: el tiempo restante y el marcador, que nflverse sí usa.</p>
    </section>

    <section class="panel step">
      <span class="step-num">Paso 5 de 5</span>
      <h2>Simular posesiones con la cadena</h2>
      <p class="lede">Desde un 1ro y 10 en la zona que elijas, el simulador toma en cada estado una jugada real que ocurrió en ese mismo estado durante ${CORE.season}, avanza el balón y repite hasta llegar a un estado absorbente. Luego compara 10,000 posesiones simuladas contra las posesiones reales que empezaron ahí.</p>
      <div class="zones" role="group" aria-label="Zona de inicio">
        ${ZONES_LTR.map((z) => `<button type="button" id="zone-${z}" data-zone="${z}" aria-pressed="${z === labZone}">${zoneLabel(z)}</button>`).join("")}
      </div>
      <div><button type="button" class="btn primary" id="sim-run">Simular 10,000 posesiones</button></div>
      <div class="stack" id="sim-out"></div>
    </section>`;

  attachHeatHover(lab);
  attachEpByDownHover(lab);
  runSimulation(lab);
  view.querySelectorAll(".zones button").forEach((btn) => {
    btn.addEventListener("click", () => {
      labZone = Number(btn.dataset.zone);
      view.querySelectorAll(".zones button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      runSimulation(lab);
    });
  });
  document.getElementById("sim-run").addEventListener("click", () => runSimulation(lab));
}

/* ---------- Navegación ---------- */
let currentRoute = "";
function route() {
  const hash = location.hash.slice(1);
  const match = /^(g|m)-(.+)$/.exec(hash);
  const game = match ? gamesById.get(match[2]) : null;
  const setCurrent = (id, on) => {
    const el = document.getElementById(id);
    if (on) el.setAttribute("aria-current", "page");
    else el.removeAttribute("aria-current");
  };
  setCurrent("nav-lab", hash === "lab");
  setCurrent("nav-home", hash !== "lab");
  if (hash === "lab") {
    renderLab();
    document.title = "Laboratorio · DATAGSPORTS";
  } else if (game) {
    renderGame(game, match[1] === "m" ? "modelo" : "partido");
    document.title = `${game.away} @ ${game.home} · DATAGSPORTS`;
  } else {
    renderHome();
    document.title = "DATAGSPORTS";
  }
}

document.getElementById("season-chip").innerHTML = `Temporada ${CORE.season}<span class="asof"> · datos al ${esc(fmtDate(CORE.generatedAt.slice(0, 10)))}</span>`;
window.addEventListener("hashchange", () => {
  const next = location.hash;
  const sameGame = currentRoute.slice(3) === next.slice(3) && /^#[gm]-/.test(currentRoute) && /^#[gm]-/.test(next);
  currentRoute = next;
  route();
  if (!sameGame) window.scrollTo(0, 0);
});
currentRoute = location.hash;
route();

// Los colores de equipo se eligen según el tema: al cambiar de tema se vuelve a pintar.
const rerender = () => route();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
