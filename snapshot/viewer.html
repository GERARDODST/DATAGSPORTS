<meta charset="utf-8">
<title>DATAGSPORTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #eef2f5;
    --surface: #ffffff;
    --surface-2: #e5ebf0;
    --ink: #0f1720;
    --muted: #566575;
    --border: #d4dce3;
    --grid: #e3e9ee;
    --bar: #c3cdd6;
    --accent: #1f9d5c;
    --accent-ink: #0b7a42;
    --accent-soft: rgba(31, 157, 92, 0.12);
    --neg: #c2413b;
    --neg-soft: rgba(194, 65, 59, 0.12);
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --warn: #9a6200;
    --warn-soft: rgba(237, 161, 0, 0.16);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0b0f14;
      --surface: #121822;
      --surface-2: #1a2230;
      --ink: #eef2f6;
      --muted: #8e9bab;
      --border: #26303f;
      --grid: #1d2633;
      --bar: #2c3748;
      --accent: #3ddc84;
      --accent-ink: #3ddc84;
      --accent-soft: rgba(61, 220, 132, 0.12);
      --neg: #f07a72;
      --neg-soft: rgba(240, 122, 114, 0.14);
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --warn: #f0b429;
      --warn-soft: rgba(240, 180, 41, 0.14);
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0b0f14;
    --surface: #121822;
    --surface-2: #1a2230;
    --ink: #eef2f6;
    --muted: #8e9bab;
    --border: #26303f;
    --grid: #1d2633;
    --bar: #2c3748;
    --accent: #3ddc84;
    --accent-ink: #3ddc84;
    --accent-soft: rgba(61, 220, 132, 0.12);
    --neg: #f07a72;
    --neg-soft: rgba(240, 122, 114, 0.14);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --warn: #f0b429;
    --warn-soft: rgba(240, 180, 41, 0.14);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    color-scheme: dark;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: max(16px, 3vw); }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: color-mix(in oklab, var(--ground) 90%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
  .wordmark { font-weight: 700; letter-spacing: -0.02em; font-size: 18px; text-decoration: none; }
  .wordmark b { color: var(--accent-ink); font-weight: 700; }
  .season-chip { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 520px) { .season-chip { display: none; } }

  main { padding-block: 28px 48px; display: flex; flex-direction: column; gap: 36px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  h1 { font-size: 26px; letter-spacing: -0.02em; line-height: 1.2; }
  h2 { font-size: 18px; letter-spacing: -0.01em; }
  h3 { font-size: 15px; }
  p { margin: 0; }
  .lede { color: var(--muted); max-width: 68ch; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }

  /* Inicio */
  .intro { display: flex; flex-direction: column; gap: 14px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-size: 20px; font-weight: 600; }
  .stat span:last-child { font-size: 12px; color: var(--muted); }

  .callout {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    text-decoration: none; background: var(--accent-soft); border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
    border-radius: 12px; padding: 16px 18px;
  }
  .callout:hover { border-color: var(--accent); }
  .callout .eyebrow { color: var(--accent-ink); }
  .callout strong { display: block; font-size: 15px; margin-top: 2px; }
  .callout .go { font-weight: 600; color: var(--accent-ink); white-space: nowrap; }

  .weeks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: thin; }
  .weeks button {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; cursor: pointer; white-space: nowrap;
  }
  .weeks button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }
  .weeks button:hover { color: var(--ink); }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .game {
    display: flex; flex-direction: column; gap: 8px; text-decoration: none; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .game:hover { border-color: var(--muted); }
  .game-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); }
  .team-row { display: grid; grid-template-columns: 10px 38px 1fr auto; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .team-row .abbr { font-weight: 600; font-size: 13px; }
  .team-row .name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-row .num { font-size: 17px; color: var(--muted); }
  .team-row.win .num { color: var(--ink); font-weight: 600; }
  .team-row.loss .abbr { color: var(--muted); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
  .chip b { color: var(--ink); font-weight: 600; }

  .two-col { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
  .two-col > * { min-width: 0; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.muted { color: var(--muted); }
  td.desc { color: var(--muted); min-width: 240px; max-width: 360px; }

  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 52px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .label { color: var(--muted); }
  .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; background: var(--bar); }
  .fill.score { background: var(--accent); }
  .fill.neg { background: var(--neg); }
  .bar-row .num { text-align: right; font-size: 12px; }

  /* Partido */
  .crumbs a { font-size: 13px; color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--ink); }
  .scoreboard { display: flex; flex-direction: column; gap: 14px; }
  .sb-meta { font-size: 12px; color: var(--muted); }
  .sb-teams { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sb-team { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .sb-team.home { flex-direction: row-reverse; text-align: right; }
  .sb-team .abbr { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sb-team .name { font-size: 12px; color: var(--muted); }
  .sb-team .num { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
  .sb-team.loss .num { color: var(--muted); }
  .sb-team .dot { width: 14px; height: 14px; }
  .sb-final { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  @media (max-width: 520px) {
    .sb-team .num { font-size: 30px; }
    .sb-team .abbr { font-size: 18px; }
    .sb-final { order: 3; width: 100%; text-align: center; }
  }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs a { text-decoration: none; font-size: 13px; font-weight: 500; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs a:hover { color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 20px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .chart-wrap { overflow-x: auto; }
  @media (max-width: 600px) { .chart-wrap .chart { min-width: 600px; } }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .mid { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.7; }
  .chart .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .cross { stroke: var(--ink); stroke-width: 1; opacity: 0.35; }
  .chart .bar { fill: var(--bar); }
  .chart .bar.hl { fill: var(--accent); }
  .chart .bar.hover { opacity: 0.75; }
  .chart .count { fill: var(--ink); font-weight: 500; }
  .readout { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 3em; }
  .readout strong { color: var(--ink); font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); max-width: 72ch; }
  .swing { font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; }
  .swing strong { color: var(--ink); }

  .step { display: flex; flex-direction: column; gap: 10px; }
  .step-num { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); font-weight: 600; }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .metrics div { display: flex; flex-direction: column; }
  .metrics .num { font-size: 18px; font-weight: 600; }
  .metrics span:last-child { font-size: 12px; color: var(--muted); }
  .pos { color: var(--accent-ink); }
  .negv { color: var(--neg); }
  ul.plain { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  .status { color: var(--muted); padding: 24px 0; }
  footer { border-top: 1px solid var(--border); }
  footer .wrap { padding-block: 18px 28px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  .focus-card {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--team, var(--accent));
    border-radius: 12px; padding: 18px 20px;
  }
  .focus-card:hover { border-color: var(--ink); border-left-color: var(--team, var(--accent)); }
  .focus-card .matchup { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .focus-card .sub { font-size: 13px; color: var(--muted); }
  .focus-card .go { font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
  .team-badge { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--team, var(--accent)); }
  @media (max-width: 560px) { .focus-card { grid-template-columns: 1fr; } .team-badge { display: none; } }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .pill.ok { color: var(--accent-ink); background: var(--accent-soft); }
  .pill.no { color: var(--neg); background: var(--neg-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.muted { color: var(--muted); background: var(--surface-2); }
  .pill.next { color: var(--ink); background: var(--surface-2); }
  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .checklist li { display: flex; gap: 10px; align-items: baseline; }
  .versus { display: grid; grid-template-columns: minmax(140px, 1.2fr) 1fr 1fr; }
  .versus > div { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .versus .h { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .versus .k { color: var(--muted); }
  .big-proj { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .big-proj .num { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; }
  .big-proj .dash { color: var(--muted); font-size: 24px; }
  .schedule td .pill { margin-left: 0; }
  tr.focus-row td { background: var(--accent-soft); }
  .result-banner { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; }
  .pill.derived { color: var(--s1); background: color-mix(in oklab, var(--s1) 14%, transparent); }
  table.items td { font-size: 13px; }
  table.items td.src, td.src { font-size: 11px; color: var(--muted); font-family: var(--mono); min-width: 190px; max-width: 280px; }
  .cell-note { font-size: 11px; color: var(--muted); margin-top: 3px; max-width: 46ch; }
  .impact { color: var(--neg); font-style: normal; }
  table.compact td, table.compact th { padding: 6px 8px; font-size: 12px; }
  table.matrix { max-width: 640px; }
  .formulas { border-top: 1px solid var(--border); padding-top: 10px; }
  .formulas summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .formula { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; margin-top: 8px; background: var(--surface-2); border-radius: 8px; font-size: 12px; }
  .formula .fname { font-weight: 600; }
  .formula code { background: transparent; padding: 0; white-space: normal; }
  .formula .subst { color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
  .formula .fres { font-family: var(--mono); font-weight: 600; color: var(--accent-ink); }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; }
  .toc a { font-size: 12px; text-decoration: none; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); }
  .toc a:hover { color: var(--ink); border-color: var(--ink); }
  .filterbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .fbtn { font: inherit; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .fbtn[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }
  .fw-section, #inventario, #resultado { scroll-margin-top: 72px; }
  #view[data-filter="disponible"] tr[data-status]:not([data-status="disponible"]),
  #view[data-filter="derivado"] tr[data-status]:not([data-status="derivado"]),
  #view[data-filter="parcial"] tr[data-status]:not([data-status="parcial"]),
  #view[data-filter="faltante"] tr[data-status]:not([data-status="faltante"]),
  #view[data-filter="no_aplica"] tr[data-status]:not([data-status="no_aplica"]),
  #view[data-filter="disponible"] .metric[data-status]:not([data-status="disponible"]),
  #view[data-filter="derivado"] .metric[data-status]:not([data-status="derivado"]),
  #view[data-filter="parcial"] .metric[data-status]:not([data-status="parcial"]),
  #view[data-filter="faltante"] .metric[data-status]:not([data-status="faltante"]),
  #view[data-filter="no_aplica"] .metric[data-status]:not([data-status="no_aplica"]) { display: none; }
  .topnav { display: flex; gap: 4px; margin-right: auto; margin-left: 12px; }
  .topnav a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 6px; }
  .topnav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
  .topnav a:hover { color: var(--ink); }
  .callouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }

  .heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; min-width: 620px; }
  .heat th { font-size: 10px; text-transform: none; letter-spacing: 0; padding: 4px; text-align: center; border: 0; line-height: 1.2; }
  .heat th.row { text-align: left; white-space: nowrap; padding-right: 8px; }
  .heat td { border: 0; padding: 7px 4px; text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; border-radius: 4px; color: var(--ink); cursor: default; }
  .heat td.thin { color: var(--muted); font-style: italic; }
  .heat td:hover, .heat td:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .heat tr.down-start th, .heat tr.down-start td { border-top: 6px solid transparent; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .scale i { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in oklab, var(--neg) 45%, var(--surface-2)), var(--surface-2), color-mix(in oklab, var(--accent) 45%, var(--surface-2))); }

  .zones { display: flex; gap: 6px; flex-wrap: wrap; }
  .zones button, .btn {
    font: inherit; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .zones button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }
  .btn.primary { color: var(--ground); background: var(--ink); border-color: var(--ink); font-weight: 600; padding: 6px 14px; }
  .btn.primary:hover { opacity: 0.9; }
  .compare { display: flex; flex-direction: column; gap: 10px; }
  .compare-row { display: grid; grid-template-columns: minmax(120px, 170px) 1fr; gap: 10px; align-items: center; font-size: 13px; }
  .compare-row .label { color: var(--muted); }
  .pair { display: flex; flex-direction: column; gap: 3px; }
  .pair div { display: grid; grid-template-columns: 1fr 46px; gap: 8px; align-items: center; }
  .pair .track { height: 7px; }
  .pair .num { font-size: 11px; text-align: right; }
  .fill.s1 { background: var(--s1); }
  .fill.s2 { background: var(--s2); }
  .trace { margin: 0; padding-left: 18px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); }
  .trace li:last-child { color: var(--ink); font-weight: 600; }
  .chart .s-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .zero { stroke: var(--muted); stroke-width: 1; }
  .chart .end-label { fill: var(--ink); font-family: var(--sans); font-size: 11px; }

<script>
const CORE = /*__CORE_DATA__*/null;

const view = document.getElementById("view");
const numFmt = new Intl.NumberFormat("es-MX");
const dateFmt = new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const weekCache = new Map();
const gamesById = new Map(CORE.games.map((g) => [g.id, g]));
const weeks = [...new Set(CORE.games.map((g) => g.week))].sort((a, b) => a - b);
const featuredGame = CORE.games.filter((g) => g.hs !== null).at(-1);

const POST_LABELS = { WC: "Comodín", DIV: "Divisional", CON: "Campeonato", SB: "Super Bowl" };
const DRIVE_LABELS = {
  "Touchdown": ["Touchdown", "score"],
  "Field goal": ["Gol de campo", "score"],
  "Missed field goal": ["Gol de campo fallado", ""],
  "Punt": ["Despeje (punt)", ""],
  "Turnover": ["Pérdida de balón", "neg"],
  "Turnover on downs": ["Pérdida en 4to down", "neg"],
  "Safety": ["Safety", "neg"],
  "Opp touchdown": ["Touchdown del rival", "neg"],
  "End of half": ["Fin de mitad", ""],
};
const PLAY_TYPE_LABELS = { pass: "Pase", run: "Carrera", punt: "Despeje (punt)", field_goal: "Gol de campo" };

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function fmtDate(iso) {
  return iso ? dateFmt.format(new Date(iso + "T12:00:00Z")) : "";
}
function signed(v, digits = 2) {
  if (v === null || v === undefined) return "—";
  return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(digits);
}
function weekType(week) {
  return CORE.games.find((g) => g.week === week)?.type ?? "REG";
}
function weekLabel(week, short = false) {
  const type = weekType(week);
  if (type !== "REG") return POST_LABELS[type] ?? type;
  return short ? `S${week}` : `Semana ${week}`;
}
function fieldLabel(yl) {
  if (yl === 50) return "Medio campo";
  return yl < 50 ? `Rival ${yl}` : `Propia ${100 - yl}`;
}
function bucketRange(bucket) {
  const lo = bucket * 5 + 1;
  const hi = lo + 4;
  const field = hi <= 50 ? `Rival ${lo}–${hi}` : `Propia ${100 - hi}–${100 - lo}`;
  return { lo, hi, field };
}
function bucketFor(yl) {
  const clamped = Math.min(99, Math.max(1, yl));
  return Math.min(19, Math.floor((clamped - 1) / 5));
}

/* Colores de equipo legibles sobre la superficie del tema actual */
function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const n = parseInt(full, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function luminance([r, g, b]) {
  const f = (c) => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function contrast(a, b) {
  const [l1, l2] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (l1 + 0.05) / (l2 + 0.05);
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function rgbToHex(rgb) {
  return "#" + rgb.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
}
function teamColors(homeAbbr, awayAbbr) {
  const surface = hexToRgb(cssVar("--surface") || "#ffffff");
  const fallback = cssVar("--muted") || "#8e9bab";
  // Si el color del equipo no contrasta con la superficie, se aclara (tema
  // oscuro) u oscurece (tema claro) el mismo tono en vez de cambiar de color.
  const target = luminance(surface) < 0.5 ? [255, 255, 255] : [0, 0, 0];
  const legible = (hex) => {
    const base = hexToRgb(hex);
    for (let t = 0; t <= 0.6001; t += 0.1) {
      const rgb = base.map((v, i) => v + (target[i] - v) * t);
      if (contrast(rgb, surface) >= 3) return rgb;
    }
    return null;
  };
  const pick = (abbr, avoid) => {
    const t = CORE.teams[abbr] ?? {};
    for (const c of [t.c1, t.c2]) {
      if (!c || !/^#[0-9a-f]{3,6}$/i.test(c)) continue;
      const rgb = legible(c);
      if (!rgb) continue;
      if (avoid) {
        const a = hexToRgb(avoid);
        if (Math.hypot(rgb[0] - a[0], rgb[1] - a[1], rgb[2] - a[2]) < 90) continue;
      }
      return rgbToHex(rgb);
    }
    return fallback;
  };
  const home = pick(homeAbbr);
  const away = pick(awayAbbr, home);
  return { home, away };
}

function spreadInfo(g) {
  if (g.spread === null || g.spread === undefined) return null;
  const fav = g.spread > 0 ? g.home : g.spread < 0 ? g.away : null;
  const line = fav ? `${fav} −${Math.abs(g.spread)}` : "Pick'em";
  let cover = null;
  if (g.hs !== null && g.as !== null) {
    const margin = g.hs - g.as;
    cover = margin > g.spread ? `cubrió ${g.home}` : margin < g.spread ? `cubrió ${g.away}` : "push";
  }
  return { line, cover };
}
function totalInfo(g) {
  if (g.total === null || g.total === undefined) return null;
  let result = null;
  if (g.hs !== null && g.as !== null) {
    const pts = g.hs + g.as;
    result = pts > g.total ? `Over (${pts})` : pts < g.total ? `Under (${pts})` : `push (${pts})`;
  }
  return { line: `O/U ${g.total}`, result };
}

async function loadWeek(week) {
  if (weekCache.has(week)) return weekCache.get(week);
  const res = await fetch(`data/week-${String(week).padStart(2, "0")}.json`);
  if (!res.ok) throw new Error(String(res.status));
  const data = await res.json();
  weekCache.set(week, data);
  return data;
}

  const colors = teamColors(g.home, g.away);

  const awayWon = played && g.as > g.hs;
  const sp = spreadInfo(g);

  const row = (abbr, score, color, won, lost) => `

}

function barRows(items, total) {
  const max = Math.max(1, ...items.map((i) => i.n));
  return items
    .map((i) => {
      const [label, kind] = DRIVE_LABELS[i.result] ?? [i.result, ""];
      const pct = total ? ((i.n / total) * 100).toFixed(0) : 0;
      return `
        <div class="bar-row">
          <span class="label">${esc(label)}</span>
          <div class="track"><div class="fill ${kind}" style="width:${((i.n / max) * 100).toFixed(1)}%"></div></div>
          <span class="num" title="${i.n} posesiones">${pct}%</span>
        </div>`;
    })
    .join("");
}

function clockLabel(row) {
  const [elapsed, quarter] = row;
  const q = quarter ?? Math.min(4, Math.floor(elapsed / 900) + 1);
  const left = Math.max(0, q <= 4 ? q * 900 - elapsed : 3600 + 600 * (q - 4) - elapsed);
  const mm = Math.floor(left / 60);
  const ss = String(Math.round(left % 60)).padStart(2, "0");
  return `${q >= 5 ? "TE" : "Q" + q} · ${mm}:${ss}`;
}

function wpChart(g, rows, colors) {
  const W = 720, H = 250, L = 64, R = 12, T = 14, B = 26;
  const PW = W - L - R, PH = H - T - B;
  const maxE = Math.max(3600, ...rows.map((r) => r[0]));
  const x = (e) => L + (e / maxE) * PW;
  const y = (p) => T + (1 - p) * PH;
  const pts = rows.map((r) => [x(r[0]), y(r[2])]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${pts.at(-1)[0].toFixed(1)} ${y(0.5)} L${pts[0][0].toFixed(1)} ${y(0.5)} Z`;
  const quarterLines = [900, 1800, 2700, 3600].filter((s) => s < maxE);
  const periods = [[0, "Q1"], [900, "Q2"], [1800, "Q3"], [2700, "Q4"]];
  if (maxE > 3600) periods.push([3600, "TE"]);

  let swingIdx = -1, swing = 0;
  for (let i = 1; i < rows.length; i++) {
    const d = rows[i][2] - rows[i - 1][2];
    if (Math.abs(d) > Math.abs(swing)) { swing = d; swingIdx = i; }
  }
  const last = pts.at(-1);

  const svg = `
    <svg class="chart" id="wp-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Probabilidad de victoria de ${esc(g.home)} durante el partido: empieza en ${Math.round(rows[0][2] * 100)}% y termina en ${Math.round(rows.at(-1)[2] * 100)}%">
      <defs>
        <clipPath id="wp-above"><rect x="${L}" y="${T}" width="${PW}" height="${PH / 2}"/></clipPath>
        <clipPath id="wp-below"><rect x="${L}" y="${T + PH / 2}" width="${PW}" height="${PH / 2}"/></clipPath>
      </defs>
      <line class="grid" x1="${L}" y1="${y(1)}" x2="${W - R}" y2="${y(1)}"/>
      <line class="grid" x1="${L}" y1="${y(0)}" x2="${W - R}" y2="${y(0)}"/>
      ${quarterLines.map((s) => `<line class="grid" x1="${x(s)}" y1="${T}" x2="${x(s)}" y2="${T + PH}"/>`).join("")}
      <path d="${area}" fill="${esc(colors.home)}" fill-opacity="0.28" clip-path="url(#wp-above)"/>
      <path d="${area}" fill="${esc(colors.away)}" fill-opacity="0.28" clip-path="url(#wp-below)"/>
      <line class="mid" x1="${L}" y1="${y(0.5)}" x2="${W - R}" y2="${y(0.5)}"/>
      <path class="line" d="${line}"/>
      ${swingIdx > 0 ? `<circle cx="${pts[swingIdx][0].toFixed(1)}" cy="${pts[swingIdx][1].toFixed(1)}" r="6" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ""}
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${L - 8}" y="${y(1) + 4}" text-anchor="end">${esc(g.home)} 100%</text>
      <text x="${L - 8}" y="${y(0.5) + 4}" text-anchor="end">50%</text>
      <text x="${L - 8}" y="${y(0) + 4}" text-anchor="end">${esc(g.away)} 100%</text>
      ${periods.map(([s, label]) => `<text x="${x(s) + 4}" y="${H - 8}">${label}</text>`).join("")}
      <line class="cross" id="wp-cross" x1="0" y1="${T}" x2="0" y2="${T + PH}" visibility="hidden"/>
      <circle id="wp-dot" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      <rect id="wp-hit" x="${L}" y="${T}" width="${PW}" height="${PH}" fill="transparent"/>
    </svg>`;

  const swingText = swingIdx > 0
    ? `<p class="swing"><strong>Jugada de mayor impacto</strong> (${esc(clockLabel(rows[swingIdx]))}): la probabilidad de ${esc(swing > 0 ? g.home : g.away)} subió ${Math.round(Math.abs(swing) * 100)} puntos. ${esc(rows[swingIdx][3] ?? "")}</p>`
    : "";
  return { svg, swingText, geometry: { L, PW, maxE, x, y } };
}

function attachWpHover(g, rows, geometry) {
  const svg = document.getElementById("wp-chart");
  const hit = document.getElementById("wp-hit");
  const cross = document.getElementById("wp-cross");
  const dot = document.getElementById("wp-dot");
  const readout = document.getElementById("wp-readout");
  if (!svg || !hit) return;
  const defaultText = readout.innerHTML;
  const show = (evt) => {
    const box = svg.getBoundingClientRect();
    const svgX = ((evt.clientX - box.left) / box.width) * 720;
    const e = ((svgX - geometry.L) / geometry.PW) * geometry.maxE;
    let lo = 0, hi = rows.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (rows[mid][0] < e) lo = mid + 1; else hi = mid;
    }
    const i = lo > 0 && Math.abs(rows[lo - 1][0] - e) < Math.abs(rows[lo][0] - e) ? lo - 1 : lo;
    const r = rows[i];
    const px = geometry.x(r[0]), py = geometry.y(r[2]);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    const leader = r[2] >= 0.5 ? g.home : g.away;
    const pct = Math.round((r[2] >= 0.5 ? r[2] : 1 - r[2]) * 100);
    readout.innerHTML = `<strong>${esc(clockLabel(r))} · ${esc(leader)} ${pct}% de ganar</strong><br>${esc(r[3] ?? "")}`;
  };
  const hide = () => {
    cross.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden");
    readout.innerHTML = defaultText;
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}

function epChart(highlightCounts) {
  const W = 720, H = 260, L = 34, R = 12, T = 24, B = 44;
  const PW = W - L - R, PH = H - T - B;
  const maxV = 7;
  const xOf = (yl) => L + ((100 - yl) / 100) * PW;
  const yOf = (v) => T + (1 - v / maxV) * PH;
  const bars = CORE.epModel.map((b) => {
    if (b.ep === null) return "";
    const x0 = xOf(b.bucket * 5 + 5) + 1;
    const x1 = xOf(b.bucket * 5) - 1;
    const hl = highlightCounts.get(b.bucket) ?? 0;
    const top = yOf(Math.max(0, b.ep));
    const base = yOf(0);
    const cx = (x0 + x1) / 2;
    return `
      <rect class="bar ${hl ? "hl" : ""}" data-bucket="${b.bucket}" x="${x0.toFixed(1)}" y="${top.toFixed(1)}" width="${(x1 - x0).toFixed(1)}" height="${(base - top).toFixed(1)}" rx="3"/>
      ${hl ? `<text class="count" x="${cx.toFixed(1)}" y="${(top - 6).toFixed(1)}" text-anchor="middle">×${hl}</text>` : ""}
      <rect class="ep-hit" data-bucket="${b.bucket}" x="${(x0 - 1).toFixed(1)}" y="${T}" width="${(x1 - x0 + 2).toFixed(1)}" height="${PH}" fill="transparent"/>`;
  }).join("");
  const ticks = [0, 1, 2, 3, 4, 5, 6, 7].map((v) => `
    <line class="grid" x1="${L}" y1="${yOf(v)}" x2="${W - R}" y2="${yOf(v)}"/>
    <text x="${L - 8}" y="${yOf(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const fieldTicks = [[100, "Tu gol", "start"], [75, "Propia 25", "middle"], [50, "50", "middle"], [25, "Rival 25", "middle"], [0, "Gol rival", "end"]]
    .map(([yl, label, anchor]) => `<text x="${xOf(yl)}" y="${H - 22}" text-anchor="${anchor}">${label}</text>`).join("");
  return `
    <svg class="chart" id="ep-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos esperados en 1er down según la posición en el campo">

function pearson(xs, ys) {
  const n = xs.length;
  if (n < 3) return null;
  const mx = xs.reduce((s, v) => s + v, 0) / n;
  const my = ys.reduce((s, v) => s + v, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
  }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}

const DOWN_NAMES = ["1ro", "2do", "3ro", "4to"];
const DIST_NAMES = ["1–3", "4–6", "7–10", "11+"];
const OUT = { YARDS: 0, TD: 1, TURNOVER: 2, PUNT: 3, FG_MADE: 4, FG_MISSED: 5 };
const EP_SERIES = [
  { down: 1, dist: 2, label: "1ro y 10", color: "var(--s1)" },
  { down: 2, dist: 1, label: "2do y 4–6", color: "var(--s2)" },
  { down: 3, dist: 1, label: "3ro y 4–6", color: "var(--s3)" },
  { down: 4, dist: 0, label: "4to y 1–3", color: "var(--s4)" },
];
let labData = null;
let labZone = 7;

async function loadLab() {
  if (labData) return labData;
  const res = await fetch("data/lab.json");
  if (!res.ok) throw new Error(String(res.status));
  labData = await res.json();
  return labData;
}
const sIdx = (down, dist, zone) => ((down - 1) * 4 + dist) * 10 + zone;
const distOf = (ytg) => (ytg <= 3 ? 0 : ytg <= 6 ? 1 : ytg <= 10 ? 2 : 3);
const zoneOf = (yl) => Math.min(9, Math.max(0, Math.floor((Math.min(99, Math.max(1, yl)) - 1) / 10)));
function zoneLabel(z) {
  const lo = 10 * z + 1, hi = 10 * z + 10;
  return hi <= 50 ? `Rival ${lo}–${hi}` : `Propia ${Math.max(1, 100 - hi)}–${100 - lo}`;
}
const ZONES_LTR = [9, 8, 7, 6, 5, 4, 3, 2, 1, 0];

function heatmap(lab) {
  const maxAbs = Math.max(...lab.ep.map((v) => Math.abs(v)));
  const head = ZONES_LTR.map((z) => {
    const [side, range] = zoneLabel(z).split(" ");
    return `<th scope="col">${side}<br>${range}</th>`;
  }).join("");
  let body = "";
  for (let d = 1; d <= 4; d++) {
    for (let dist = 0; dist < 4; dist++) {
      const cells = ZONES_LTR.map((z) => {
        const i = sIdx(d, dist, z);
        const v = lab.ep[i];
        const pct = Math.round(Math.min(1, Math.abs(v) / maxAbs) * 45);
        const pole = v >= 0 ? "var(--accent)" : "var(--neg)";
        return `<td tabindex="0" data-i="${i}" class="${lab.n[i] < 20 ? "thin" : ""}" style="background:color-mix(in oklab, ${pole} ${pct}%, var(--surface-2))">${signed(v, 1)}</td>`;
      }).join("");
      body += `<tr class="${dist === 0 && d > 1 ? "down-start" : ""}"><th class="row" scope="row">${DOWN_NAMES[d - 1]} y ${DIST_NAMES[dist]}</th>${cells}</tr>`;
    }
  }
  return `<div class="table-scroll"><table class="heat" id="heat"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function convergenceChart(iters) {
  const W = 720, H = 210, L = 52, R = 16, T = 14, B = 30;

  const x = (i) => L + (i / Math.max(1, iters.length - 1)) * PW;
  const y = (v) => T + ((logMax - Math.log10(Math.max(v, 10 ** logMin))) / (logMax - logMin)) * PH;
  const path = iters.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const yTicks = [[10, "10"], [1, "1"], [0.1, "0.1"], [0.01, "0.01"], [0.001, "0.001"]];
  const xTicks = [];
  for (let i = 0; i < iters.length; i += 25) xTicks.push(i);
  if (xTicks.at(-1) !== iters.length - 1) xTicks.push(iters.length - 1);
  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cambio máximo de EP por iteración: de ${iters[0].toFixed(2)} a ${iters.at(-1).toFixed(4)} puntos en ${iters.length} iteraciones">
      ${yTicks.map(([v, t]) => `<line class="grid" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${t}</text>`).join("")}

}

    .map(([col, t]) => `<text x="${x(col)}" y="${H - 22}" text-anchor="middle">${t}</text>`).join("");
  const hits = ZONES_LTR.map((z, col) => `<rect class="ep2-hit" data-zone="${z}" data-col="${col}" x="${(L + (col / 10) * PW).toFixed(1)}" y="${T}" width="${(PW / 10).toFixed(1)}" height="${PH}" fill="transparent"/>`).join("");
  return `

function simulateDrive(trans, start, trace) {
  let { down, ytg, yl } = start;
  const steps = [];
  const where = () => `${DOWN_NAMES[down - 1]} y ${ytg >= yl ? "gol" : ytg} en ${fieldLabel(yl)}`;
  const end = (result, points, text) => {
    if (trace && text) steps.push(text);
    return { result, points, steps };
  };
  for (let step = 0; step < 40; step++) {
    const t = trans[sIdx(down, distOf(ytg), zoneOf(yl))];
    if (!t || t[1].length === 0) return end("Punt", 0, `${where()} → despeje`);
    const k = Math.floor(Math.random() * t[1].length);
    const code = t[1][k];
    if (code === OUT.TD) return end("Touchdown", 6.94, `${where()} → touchdown`);
    if (code === OUT.TURNOVER) return end("Turnover", 0, `${where()} → pérdida de balón`);
    if (code === OUT.PUNT) return end("Punt", 0, `${where()} → despeje (punt)`);
    if (code === OUT.FG_MADE) return end("Field goal", 3, `${where()} → gol de campo bueno`);
    if (code === OUT.FG_MISSED) return end("Missed field goal", 0, `${where()} → gol de campo fallado`);
    const gain = t[0][k];
    if (trace) steps.push(`${where()} → ${gain >= 0 ? "+" : "−"}${Math.abs(gain)} yardas`);
    yl -= gain;
    if (yl <= 0) return end("Touchdown", 6.94, "Touchdown");
    if (yl >= 100) return end("Safety", -2, "Safety");
    if (gain >= ytg) { down = 1; ytg = Math.min(10, yl); }
    else {
      down += 1; ytg -= gain;
      if (down > 4) return end("Turnover on downs", 0, "Pérdida en 4to down");
    }
  }
  return end("End of half", 0, "Fin de mitad");
}

function runSimulation(lab) {
  const N = 10000;
  const yl = 10 * labZone + 5;
  const start = { down: 1, ytg: Math.min(10, yl), yl };
  const counts = {};
  let pts = 0;
  for (let i = 0; i < N; i++) {
    const r = simulateDrive(lab.transitions, start, false);
    counts[r.result] = (counts[r.result] ?? 0) + 1;
    pts += r.points;
  }
  const trace = simulateDrive(lab.transitions, start, true);
  const real = lab.driveStarts[labZone];
  const realPts = real.n ? real.points / real.n : null;
  const cats = [...new Set([...Object.keys(real.results), ...Object.keys(counts)])]
    .sort((a, b) => ((real.results[b] ?? 0) / (real.n || 1) + (counts[b] ?? 0) / N) - ((real.results[a] ?? 0) / (real.n || 1) + (counts[a] ?? 0) / N));
  const maxShare = Math.max(...cats.map((c) => Math.max((counts[c] ?? 0) / N, real.n ? (real.results[c] ?? 0) / real.n : 0)));
  const bar = (share, cls) => `<div><div class="track"><div class="fill ${cls}" style="width:${((share / maxShare) * 100).toFixed(1)}%"></div></div><span class="num">${(share * 100).toFixed(1)}%</span></div>`;
  const endHalf = real.n ? (real.results["End of half"] ?? 0) / real.n : 0;
  const diff = realPts === null ? null : pts / N - realPts;

  document.getElementById("sim-out").innerHTML = `
    <div class="metrics">
      <div><span class="num">${(pts / N).toFixed(2)}</span><span>puntos por posesión, simulados (${numFmt.format(N)})</span></div>
      <div><span class="num">${realPts === null ? "—" : realPts.toFixed(2)}</span><span>puntos por posesión reales (${numFmt.format(real.n)} posesiones)</span></div>
      <div><span class="num ${diff > 0 ? "negv" : "pos"}">${diff === null ? "—" : signed(diff)}</span><span>diferencia del simulador</span></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--s1)"></i>Simulado</span>
      <span><i class="dot" style="background:var(--s2)"></i>Real ${CORE.season}</span>
    </div>
    <div class="compare">
      ${cats.map((c) => `
        <div class="compare-row">
          <span class="label">${esc((DRIVE_LABELS[c] ?? [c])[0])}</span>
          <div class="pair">${bar((counts[c] ?? 0) / N, "s1")}${bar(real.n ? (real.results[c] ?? 0) / real.n : 0, "s2")}</div>
        </div>`).join("")}
    </div>
    <div>
      <h3 style="margin-bottom:6px">Una de esas posesiones, jugada por jugada</h3>
      <ol class="trace">${trace.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    </div>
    <p class="note">Por qué no coinciden del todo: el simulador no tiene reloj, así que una posesión nunca termina por fin de mitad (en los datos reales eso le pasó al ${(endHalf * 100).toFixed(0)}% de las posesiones que empezaron aquí) ni por touchdown del rival. Ese es el componente semi-Markov del framework (sección 5.4.1): agregar el tiempo restante al estado.</p>`;
}

function lossCurve(points, chosen, color, fmtV) {
  const W = 260, H = 120, L = 44, R = 10, T = 12, B = 26;
  const xs = points.map((p) => p.value), ys = points.map((p) => p.loss);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys), ymax = Math.max(...ys);
  const pad = (ymax - ymin) * 0.15 || 0.0005;
  const x = (v) => L + (xs.length > 1 ? ((xs.indexOf(v)) / (xs.length - 1)) : 0.5) * (W - L - R);
  const y = (v) => T + (1 - (v - (ymin - pad)) / (ymax - ymin + 2 * pad)) * (H - T - B);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(p.value).toFixed(1)},${y(p.loss).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Log-loss según el parámetro">
    <line class="grid" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    <text x="${L - 4}" y="${y(ymin) + 3}" text-anchor="end">${ymin.toFixed(ymax - ymin < 0.002 ? 5 : 4)}</text>
    ${ymax - ymin > 1e-6 ? `<text x="${L - 4}" y="${y(ymax) + 3}" text-anchor="end">${ymax.toFixed(ymax - ymin < 0.002 ? 5 : 4)}</text>` : ""}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    ${points.map((p) => `<circle cx="${x(p.value).toFixed(1)}" cy="${y(p.loss).toFixed(1)}" r="${p.value === chosen ? 5 : 3}" style="fill:${p.value === chosen ? color : "var(--surface)"}" stroke="${color}" stroke-width="1.5"><title>${fmtV(p.value)}: ${p.loss.toFixed(5)}</title></circle>`).join("")}
    ${points.map((p) => `<text x="${x(p.value).toFixed(1)}" y="${H - 8}" text-anchor="middle">${fmtV(p.value)}</text>`).join("")}
  </svg>`;
}
const fmtParam = (v) => (Math.abs(v - 1 / 3) < 1e-9 ? "⅓" : Number.isInteger(v) ? String(v) : String(Number(v.toFixed(2))));

function optimizationPanel(D, key) {
  const opt = D.optimization[0]?.models[key];
  if (!opt) return "";
  const color = MODEL_COLORS[key];
  const params = Object.keys(opt.best).filter((p) => opt.trace.some((t) => t.param === p));
  const curves = params.map((p) => {
    const lastPass = Math.max(...opt.trace.filter((t) => t.param === p).map((t) => t.pass));
    const pts = opt.trace.filter((t) => t.param === p && t.pass === lastPass).map((t) => ({ value: t.value, loss: t.loss }));
    return `<div class="curve"><div class="curve-title">${esc(PARAM_INFO[key]?.[p] ?? p)} → <b>${fmtParam(opt.best[p])}</b></div>${lossCurve(pts, opt.best[p], color, fmtParam)}</div>`;
  }).join("");
  const stab = D.optimization[1]?.models[key];
  return `
    <div class="opt-head">
      <span>Log-loss de entrenamiento <b class="num">${opt.initialLoss.toFixed(4)} → ${opt.bestLoss.toFixed(4)}</b></span>
      <span><b class="num">${opt.evaluations}</b> corridas completas del modelo (walk-forward)</span>
      <span><b class="num">${opt.seconds.toFixed(1)} s</b></span>
    </div>
    <div class="curves">${curves}</div>
    <div class="table-scroll"><table class="compact">
      <thead><tr><th>Parámetro</th><th class="r">Inicial</th><th class="r">Óptimo 2020–22</th><th class="r">Óptimo 2019–21</th></tr></thead>
      <tbody>${Object.keys(opt.best).map((p) => `<tr><td>${esc(PARAM_INFO[key]?.[p] ?? p)}</td><td class="r num">${opt.start[p] !== undefined ? fmtParam(opt.start[p]) : "—"}</td><td class="r num"><b>${fmtParam(opt.best[p])}</b></td><td class="r num">${stab?.best[p] !== undefined ? fmtParam(stab.best[p]) : "—"}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

function weightsChart(D) {
  const W = 720, H = 240, L = 40, R = 110, T = 16, B = 30;
  const data = D.weights2024;
  if (!data.length) return "";
  const keys = ["framework", "elo", "kalman", "ridge", "epa"];
  const top = Math.ceil(Math.max(...data.flatMap((w) => keys.map((k) => w.win[k] ?? 0))) * 10) / 10;
  const x = (i) => L + (i / Math.max(1, data.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / top) * (H - T - B);
  const lastY = spreadLabels(keys.map((k) => ({ k, y: y(data[data.length - 1].win[k] ?? 0) + 4 })), 13, T + 4, H - B);
  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v += 0.1) ticks.push(Number(v.toFixed(1)));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de cada modelo en el ensamble durante 2024">
    ${ticks.map((v) => `<line class="grid" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${Math.round(v * 100)}%</text>`).join("")}
    <line class="mid" x1="${L}" y1="${y(0.2)}" x2="${W - R}" y2="${y(0.2)}"/>
    ${keys.map((k) => `<path d="${data.map((w, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(w.win[k] ?? 0).toFixed(1)}`).join("")}" fill="none" stroke="${MODEL_COLORS[k]}" stroke-width="2"/>
      <text x="${W - R + 6}" y="${lastY.get(k)}" style="fill:${MODEL_COLORS[k]}">${SHORT_NAMES[k]} ${((data[data.length - 1].win[k] ?? 0) * 100).toFixed(0)}%</text>`).join("")}
    ${weekTicks(data.map((w) => w.week)).map((t) => `<text x="${x(t.i)}" y="${H - 10}" text-anchor="middle">${t.label}</text>`).join("")}
  </svg>`;
}

function cumulativeChart(D) {
  const W = 720, H = 260, L = 48, R = 110, T = 16, B = 30;
  const data = D.cumulative;
  if (!data.length) return "";
  const keys = ["framework", "elo", "kalman", "ridge", "epa", "final", "market"];
  const vals = data.slice(2).flatMap((d) => keys.map((k) => d.loss[k]));
  const lo = Math.min(...vals) - 0.01, hi = Math.max(...vals) + 0.01;
  const x = (i) => L + (i / Math.max(1, data.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (H - T - B);
  const ticks = [];
  for (let t = Math.ceil(lo * 50) / 50; t <= hi; t += 0.02) ticks.push(t);
  const last = data[data.length - 1];
  const labelY = spreadLabels(keys.map((k) => ({ k, y: y(last.loss[k]) + 4 })), 13, T + 4, H - B + 4);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Log-loss acumulada por semana en 2024">
    ${ticks.map((t) => `<line class="grid" x1="${L}" y1="${y(t)}" x2="${W - R}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t.toFixed(2)}</text>`).join("")}
    ${keys.map((k) => `<path d="${data.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d.loss[k]).toFixed(1)}`).join("")}" fill="none" stroke="${MODEL_COLORS[k]}" stroke-width="${k === "final" || k === "market" ? 3 : 1.5}" ${k === "market" ? 'stroke-dasharray="5 4"' : ""}/>
      <text x="${W - R + 6}" y="${labelY.get(k)}" style="fill:${MODEL_COLORS[k]};${k === "final" || k === "market" ? "font-weight:600" : ""}">${SHORT_NAMES[k]} ${last.loss[k].toFixed(3)}</text>`).join("")}
    ${weekTicks(data.map((d) => d.week)).map((t) => `<text x="${x(t.i)}" y="${H - 10}" text-anchor="middle">${t.label}</text>`).join("")}
  </svg>`;
}

function calibrationChart(D) {
  const W = 360, H = 320, L = 44, R = 12, T = 12, B = 40;
  const s = (v) => L + v * (W - L - R), y = (v) => T + (1 - v) * (H - T - B);
  const series = [["final", MODEL_COLORS.final], ["market", MODEL_COLORS.market]];
  return `<svg class="chart calib" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibración: probabilidad predicha contra frecuencia observada">
    ${[0, 0.25, 0.5, 0.75, 1].map((v) => `<line class="grid" x1="${s(v)}" y1="${T}" x2="${s(v)}" y2="${H - B}"/><line class="grid" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"/><text x="${s(v)}" y="${H - B + 14}" text-anchor="middle">${v * 100}%</text><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v * 100}%</text>`).join("")}
    <line x1="${s(0)}" y1="${y(0)}" x2="${s(1)}" y2="${y(1)}" class="mid"/>
    ${series.map(([k, color]) => (D.calibration[k] ?? []).map((b) => `<circle cx="${s(b.predicted)}" cy="${y(b.observed)}" r="${Math.max(3, Math.sqrt(b.n))}" style="fill:${color};fill-opacity:0.35" stroke="${color}" stroke-width="1.5"><title>${esc(MODEL_NAMES[k])}: predicho ${pct(b.predicted)}, observado ${pct(b.observed)} (${b.n} partidos)</title></circle>`).join("")).join("")}
    <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">probabilidad predicha</text>
  </svg>`;
}

function gridTable(grid, rowsKey, colsKey, rowsLabel, colsLabel, fmtRow = fmtParam, fmtCol = fmtParam) {
  const rows = [...new Set(grid.map((g) => g[rowsKey]))];
  const cols = [...new Set(grid.map((g) => g[colsKey]))];
  const best = Math.min(...grid.map((g) => g.loss)), worst = Math.max(...grid.map((g) => g.loss));
  const cell = (r, c) => grid.find((g) => g[rowsKey] === r && g[colsKey] === c);
  return `<div class="table-scroll"><table class="heat gridheat">
    <thead><tr><th class="row">${esc(rowsLabel)} \\ ${esc(colsLabel)}</th>${cols.map((c) => `<th>${fmtCol(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr><th class="row">${fmtRow(r)}</th>${cols.map((c) => { const g = cell(r, c); if (!g) return "<td></td>"; const t = (g.loss - best) / ((worst - best) || 1); return `<td style="background:color-mix(in oklab, var(--accent) ${Math.round((1 - t) * 55)}%, var(--surface-2))" class="${g.loss === best ? "best" : ""}" title="${g.loss.toFixed(5)}">${g.loss.toFixed(4)}</td>`; }).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function yearSwap(D) {
  const rank = (period) => D.leaderboard.find((p) => p.period === period).rows.filter((r) => ["framework", "elo", "kalman", "ridge", "epa"].includes(r.key)).sort((a, b) => a.logLoss - b.logLoss);
  const v = rank("valid"), t = rank("test");
  const name = (r) => MODEL_NAMES[r.key].split(" (")[0];
  return `en 2023 el mejor fue ${name(v[0])} y el peor ${name(v[v.length - 1])}; en 2024 el mejor fue ${name(t[0])} y el peor ${name(t[t.length - 1])}`;
}

function keyNumbersChart(K) {
  const W = 720, H = 240, L = 40, R = 16, T = 20, B = 36;
  const rows = K.weights.filter((w) => w.k >= 1);
  const max = Math.max(...rows.map((w) => Math.max(w.observed, w.expected)));
  const bw = (W - L - R) / rows.length;
  const y = (v) => T + (1 - v / max) * (H - T - B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Partidos por margen: observados contra esperados por la curva continua">
    <line class="grid" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    ${rows.map((w, i) => {
      const x0 = L + i * bw;
      return `<rect x="${(x0 + bw * 0.15).toFixed(1)}" y="${y(w.observed).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${(H - B - y(w.observed)).toFixed(1)}" rx="2" style="fill:${[3, 7, 10].includes(w.k) ? "var(--accent)" : "var(--bar)"}"><title>Margen ${w.k}: ${w.observed} partidos; la curva esperaba ${w.expected} (ω = ${w.omega})</title></rect>
        <line x1="${(x0 + bw * 0.1).toFixed(1)}" x2="${(x0 + bw * 0.9).toFixed(1)}" y1="${y(w.expected).toFixed(1)}" y2="${y(w.expected).toFixed(1)}" stroke="var(--ink)" stroke-width="2"/>
        <text x="${(x0 + bw / 2).toFixed(1)}" y="${H - B + 14}" text-anchor="middle">${w.k}</text>
        ${[3, 7, 10].includes(w.k) ? `<text x="${(x0 + bw / 2).toFixed(1)}" y="${(y(w.observed) - 5).toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">×${w.omega.toFixed(1)}</text>` : ""}`;
    }).join("")}
    <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">margen final (puntos, en valor absoluto)</text>
  </svg>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Números clave (3, 7, 10)</span><span><i class="dot" style="background:var(--bar)"></i>Otros márgenes: partidos observados</span><span><i style="display:inline-block;width:14px;height:2px;background:var(--ink)"></i>Lo que esperaba la curva continua</span></div>`;
}

  if (researchData) return researchData;
  const res = await fetch("data/research.json");
  if (!res.ok) throw new Error(String(res.status));
  researchData = await res.json();
  return researchData;
}

  pendiente: { label: "Pendiente", cls: "muted" },

}

function focusCard(gameId) {

function probabilityChart(a, marketHome) {
  const rows = [
    ...a.methods.map((m) => ({ label: { log5: "Framework · Log5", elo: "Framework · Elo interno", sim: "Framework · simulación" }[m.key] ?? m.label, p: m.p, color: "var(--muted)" })),
    ...(a.models ? [
      { label: "Triangulación (framework)", p: a.pTriangulated, color: "var(--muted)" },
      ...["elo", "kalman", "ridge", "epa"].filter((k) => a.models.preds[k]).map((k) => ({ label: MODEL_NAMES[k], p: a.models.preds[k].p, color: MODEL_COLORS[k] })),
      { label: "Final: ensamble + QB + 5.3", p: a.pHome, color: "var(--accent)", strong: true },
    ] : [{ label: "Promedio del modelo", p: a.pHome, color: "var(--accent)", strong: true }]),
    ...(marketHome !== null ? [{ label: "Mercado (momios sin margen)", p: marketHome, color: "var(--ink)", strong: true }] : []),
  ];
  const W = 720, rowH = 30, T = 24, B = 24, L = 250, R = 24;
  const H = T + rows.length * rowH + B;
  // (filas: métodos del framework, modelos del torneo, final y mercado)
  const PW = W - L - R;
  const values = rows.map((r) => r.p);
  const lo = Math.max(0, Math.floor((Math.min(...values, 0.5) - 0.08) * 10) / 10);
  const hi = Math.min(1, Math.ceil((Math.max(...values, 0.5) + 0.08) * 10) / 10);
  const x = (p) => L + ((p - lo) / (hi - lo)) * PW;
  const ticks = [];
  for (let t = lo; t <= hi + 1e-9; t += 0.05) ticks.push(Number(t.toFixed(2)));
  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Probabilidad de que gane ${esc(a.home)} según cada método y según el mercado">
      ${ticks.map((t) => `<line class="${Math.abs(t - 0.5) < 1e-9 ? "mid" : "grid"}" x1="${x(t)}" y1="${T - 6}" x2="${x(t)}" y2="${H - B}"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle">${Math.round(t * 100)}%</text>`).join("")}
      <text x="${x(0.5)}" y="${T - 10}" text-anchor="middle">parejo</text>
      ${rows.map((r, i) => {
        const cy = T + i * rowH + rowH / 2;
        return `<text class="end-label" x="${L - 12}" y="${cy + 4}" text-anchor="end" style="${r.strong ? "font-weight:600" : ""}">${esc(r.label)}</text>
          <line class="grid" x1="${L}" y1="${cy}" x2="${W - R}" y2="${cy}" opacity="0.5"/>
          <circle cx="${x(r.p).toFixed(1)}" cy="${cy}" r="${r.strong ? 6 : 5}" style="fill:${r.color}" stroke="var(--surface)" stroke-width="2"/>
          <text x="${(x(r.p) + 10).toFixed(1)}" y="${cy + 4}" style="fill:var(--ink)">${pct(r.p)}</text>`;
      }).join("")}
    </svg>`;
}

function marginChart(a) {
  const W = 720, H = 250, L = 40, R = 16, T = 58, B = 40;
  const PW = W - L - R, PH = H - T - B;
  const total = a.marginBins.reduce((s, b) => s + b[1], 0);
  const maxShare = Math.max(...a.marginBins.map((b) => b[1] / total));
  const lo = -35, hi = 35;
  const x = (m) => L + ((m - lo) / (hi - lo)) * PW;
  const bw = PW / (hi - lo + 1);
  const y = (s) => T + (1 - s / maxShare) * PH;
  const bars = a.marginBins.filter(([m]) => m >= lo && m <= hi).map(([m, n]) => {
    const s = n / total;
    return `<rect class="mbar" data-m="${m}" data-s="${s}" x="${(x(m) - bw / 2 + 1).toFixed(1)}" y="${y(s).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${(T + PH - y(s)).toFixed(1)}" rx="2" style="fill:${m > 0 ? "var(--s1)" : "var(--s2)"}"/>`;
  }).join("");
  const markers = [
    { m: a.projection.margin, label: `proyección ${signed(a.projection.margin, 1)}`, cls: "cross", color: "var(--ink)" },
    ...(a.context.spread !== null ? [{ m: a.context.spread, label: `línea: ${a.context.spread >= 0 ? a.home : a.away} −${Math.abs(a.context.spread)}`, color: "var(--muted)" }] : []),
    ...(a.postgame ? [{ m: a.postgame.homeScore - a.postgame.awayScore, label: `real ${signed(a.postgame.homeScore - a.postgame.awayScore, 0)}`, color: "var(--accent)", strong: true }] : []),
  ].sort((p, q) => p.m - q.m);
  const markerSvg = markers.map((mk, i) => {
    const mx = x(Math.max(lo, Math.min(hi, mk.m)));
    const ly = 14 + i * 14;
    return `<line x1="${mx}" y1="${ly + 3}" x2="${mx}" y2="${T + PH}" style="stroke:${mk.color}" stroke-width="${mk.strong ? 2 : 1.5}" ${mk.strong ? "" : 'stroke-dasharray="4 3"'}/>
      <text x="${mx + 4}" y="${ly}" style="fill:var(--ink);${mk.strong ? "font-weight:600" : ""}">${esc(mk.label)}</text>`;
  }).join("");
  const ticks = [-28, -21, -14, -7, 0, 7, 14, 21, 28];
  return `
    <svg class="chart" id="margin-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución del margen final en ${numFmt.format(total)} partidos simulados">
      <line class="grid" x1="${L}" y1="${T + PH}" x2="${W - R}" y2="${T + PH}"/>
      ${bars}
      ${markerSvg}
      ${ticks.map((t) => `<text x="${x(t)}" y="${T + PH + 16}" text-anchor="middle">${t === 0 ? "0" : signed(t, 0)}</text>`).join("")}
      <text x="${L}" y="${H - 4}">← gana ${esc(a.away)}</text>
      <text x="${W - R}" y="${H - 4}" text-anchor="end">gana ${esc(a.home)} →</text>
      <text x="${L + PW / 2}" y="${H - 4}" text-anchor="middle">margen final (${esc(a.home)} − ${esc(a.away)}), múltiplos de 7</text>
      <rect id="margin-hit" x="${L}" y="${T}" width="${PW}" height="${PH}" fill="transparent"/>
    </svg>`;
}

function attachMarginHover(a) {
  const hit = document.getElementById("margin-hit");
  const svg = document.getElementById("margin-chart");
  const readout = document.getElementById("margin-readout");
  if (!hit) return;
  const defaultText = readout.innerHTML;
  const total = a.marginBins.reduce((s, b) => s + b[1], 0);
  const byM = new Map(a.marginBins.map(([m, n]) => [m, n]));
  const show = (evt) => {
    const box = svg.getBoundingClientRect();
    const sx = ((evt.clientX - box.left) / box.width) * 720;
    const m = Math.round(-35 + ((sx - 40) / 664) * 70);
    const n = byM.get(m) ?? 0;
    svg.querySelectorAll(".mbar").forEach((b) => (b.style.opacity = Number(b.dataset.m) === m ? "1" : "0.55"));
    const who = m > 0 ? `${a.home} gana por ${m}` : m < 0 ? `${a.away} gana por ${-m}` : "empate en tiempo regular";
    readout.innerHTML = `<strong>${esc(who)}</strong>: ${pct(n / total)} de las ${numFmt.format(total)} simulaciones.`;
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", () => {
    svg.querySelectorAll(".mbar").forEach((b) => (b.style.opacity = "1"));
    readout.innerHTML = defaultText;
  });
}

function marketImpliedHome(a) {
  const c = a.context;
  if (c.homeMoneyline === null || c.awayMoneyline === null) return null;
  const imp = (v) => (v < 0 ? -v / (-v + 100) : 100 / (v + 100));
  const h = imp(c.homeMoneyline), w = imp(c.awayMoneyline);
  return h / (h + w);
}

function lightPill(light) {
  const cls = light === "Verde" ? "ok" : light === "Amarillo" ? "warn" : "muted";
  const icon = light === "Verde" ? "●" : light === "Amarillo" ? "▲" : "○";
  return `<span class="pill ${cls}">${icon} ${esc(light)}</span>`;
}
function outcomePill(m) {
  if (m.won === null) return `<span class="pill muted">Pendiente</span>`;
  if (m.push) return `<span class="pill muted">= Push</span>`;
  return m.won ? `<span class="pill ok">✓ Ganó</span>` : `<span class="pill no">✗ Perdió</span>`;
}
function marketPickLabel(m) {
  if (m.market === "Moneyline") return `${m.pick} gana`;
  return `${m.pick} ${m.line}`;
}

/* ---------- Glosario: siglas y conceptos con su explicación ---------- */
const GLOSSARY = {
  epa: ["EPA (Expected Points Added)", "Puntos esperados que suma o resta una jugada. Se calcula como EP después − EP antes, donde EP depende del down, la distancia y la yarda. EPA/jugada positivo = la ofensiva avanza hacia anotar."],
  cpoe: ["CPOE", "Completion Percentage Over Expected: cuántos puntos porcentuales completa el QB por encima de lo esperado según la dificultad de cada pase (distancia, presión, ubicación)."],
  anya: ["ANY/A", "Adjusted Net Yards per Attempt = (yardas + 20·TD − 45·INT − yardas perdidas en sacks) / (intentos + sacks). Premia touchdowns y castiga intercepciones y sacks; predice mejor que el passer rating."],
  qbr: ["QBR", "Total QBR de ESPN (0–100; 50 = promedio). Mide la aportación del QB por jugada, incluidas carreras y sacks, ajustada por la dificultad. Su fórmula es propietaria, pero ESPN publica los valores y nflverse los redistribuye."],
  ensemble: ["Ensamble (Hedge)", "Combinación de varios modelos: P = Σ w·p. Cada peso es w ∝ exp(−η·L), donde L es la pérdida acumulada del modelo con olvido. El que más acierta gana peso; con η = 1 es un promedio bayesiano de modelos."],
  logloss: ["Log-loss", "Pérdida logarítmica: −[y·ln p + (1−y)·ln(1−p)], con y = 1 si ganó el local. Castiga mucho decir 90% y fallar. Decir siempre 50% da 0.693; menor es mejor."],
  qbvalue: ["Valor de QB", "Cuánto aporta cada QB: EPA por jugada propia (pases, sacks y carreras) de toda su carrera en los datos, regresada al nivel medido de un QB nuevo. Se compara con el nivel de QB que ya traen los ratings del equipo; la diferencia se convierte a puntos con una regresión sobre partidos anteriores."],
  qblayer: ["Capa de QB", "Si un equipo arranca con un QB distinto al que más partidos inició en su última temporada, el margen se corrige δ puntos en su contra. δ se estima solo con partidos anteriores: δ = Σ residuos / (n + k₀)."],
  kalman: ["Filtro de Kalman", "Estima la fuerza de cada equipo como una variable que cambia en el tiempo. Tras cada partido corrige la estimación en proporción a la sorpresa y a su incertidumbre: x ← x + K·(resultado − predicción)."],
  ridge: ["Regresión ridge", "Mínimos cuadrados con penalización λ·Σβ²: encoge las calificaciones hacia 0 cuando hay pocos datos. Equivale a un modelo bayesiano con previa normal."],
  walkforward: ["Walk-forward", "Prueba en orden cronológico: para predecir cada fecha el modelo solo conoce lo anterior. Es la única forma honesta de medir un modelo de pronóstico."],
  inactive: ["Inactivos oficiales", "Lista que cada equipo entrega 90 minutos antes del partido con los jugadores que no van a jugar. Confirma las dudas del reporte de lesiones (Doubtful, Questionable)."],
  passerRating: ["Passer rating", "Rating oficial de la NFL (0 a 158.3) con 4 componentes por intento: % de pases completos, yardas, TD e INT. No considera sacks ni carreras."],
  success: ["Success rate", "% de jugadas exitosas: ganar al menos 40% de la distancia en 1er down, 60% en 2do y el 100% en 3ro o 4to down."],
  pressure: ["Pressure rate", "Presiones (hurries + golpes al QB + sacks) divididas entre los dropbacks del rival. Mide qué tan seguido la defensa incomoda al QB."],
  sack: ["Sack%", "Sacks divididos entre dropbacks. Ofensiva: más bajo es mejor. Defensa: más alto es mejor."],
  dropback: ["Dropback", "Jugada en la que el QB retrocede para pasar. Incluye pases, sacks y scrambles."],
  redzone: ["Zona roja", "Dentro de las 20 yardas del rival. El % de touchdowns en zona roja separa a los equipos que anotan 7 de los que se conforman con 3."],
  third: ["3er down", "% de terceras oportunidades convertidas en primer down. Mantiene vivas las posesiones."],
  explosive: ["Jugadas explosivas", "Jugadas de 20 yardas o más. Pocas jugadas explosivas cambian un partido."],
  takeaways: ["Takeaways", "Balones recuperados por la defensa: intercepciones más fumbles recuperados."],
  pyth: ["Pitagórico", "Win% esperado = PF^2.37 / (PF^2.37 + PA^2.37), con PF/PA = puntos a favor y en contra. Si un equipo gana mucho más de lo que dice, tuvo suerte en partidos cerrados."],
  log5: ["Log5", "Fórmula de Bill James para la probabilidad de que A le gane a B a partir de sus win% individuales: (pA − pA·pB) / (pA + pB − 2·pA·pB)."],
  elo: ["Elo", "Rating que sube cuando un equipo gana y baja cuando pierde, más si el rival era fuerte o el margen fue grande. La diferencia de Elo se convierte en probabilidad de victoria."],
  lambda: ["λ (lambda)", "Puntos esperados de un equipo en el partido. λ = promedio de liga + (ofensiva propia − promedio) + (defensa rival − promedio) ± ventaja de local."],
  sigma: ["σ (sigma)", "Desviación estándar: cuánto varía el resultado alrededor de lo esperado. En la NFL el margen final varía ±14 puntos, por eso ningún partido es seguro."],
  hfa: ["HFA", "Home Field Advantage: ventaja de jugar en casa, en puntos. Se mide como el margen promedio del local en la temporada anterior."],
  shrink: ["Regresión a la media", "Con pocos datos, un valor extremo suele ser en parte suerte. Se mezcla con el promedio de liga: θ̂ = n/(n+k)·observado + k/(n+k)·liga. Más datos (n) → más peso a lo observado."],
  montecarlo: ["Monte Carlo", "Simular el partido miles de veces con números aleatorios y contar con qué frecuencia pasa cada resultado. Da probabilidades en vez de un único marcador."],
  triang: ["Triangulación", "Calcular la probabilidad con tres métodos independientes (Log5, Elo y simulación). Si coinciden, hay más confianza; si divergen, menos."],
  moneyline: ["Moneyline", "Apuesta a quién gana el partido, sin importar el margen."],
  spread: ["Spread", "Ventaja en puntos que se le da al equipo débil. KC −3 significa que KC debe ganar por más de 3 para cubrir."],
  overunder: ["Over / Under", "Apuesta a si los puntos totales del partido quedan por encima (Over) o por debajo (Under) de la línea."],
  push: ["Push", "Empate exacto con la línea (por ejemplo, ganar por 3 con spread de 3): se devuelve la apuesta."],
  odds: ["Momio americano", "−148: hay que apostar 148 para ganar 100. +124: apostando 100 se ganan 124. El signo indica favorito (−) o no favorito (+)."],
  implied: ["Probabilidad implícita", "La probabilidad que implica un momio: |m|/(|m|+100) si es negativo, 100/(m+100) si es positivo. Se normaliza para quitar el margen de la casa."],
  vig: ["Margen de la casa", "Las probabilidades implícitas de ambos lados suman más de 100%; ese exceso es la ganancia de la casa y se quita antes de comparar."],
  edge: ["Edge", "Ventaja = probabilidad del modelo − probabilidad implícita. Con edge positivo el precio paga más de lo que el modelo cree que vale el riesgo."],
  fair: ["Momio justo", "El momio que correspondería exactamente a la probabilidad del modelo. Si el mercado paga mejor que el momio justo, hay valor."],
  kelly: ["Kelly (¼ Kelly)", "Fórmula para el tamaño de la apuesta como % del bankroll: f* = (b·p − q)/b. Se usa un cuarto de Kelly para protegerse de errores del modelo."],
  brier: ["Brier", "Error de una probabilidad: (probabilidad − resultado)², con resultado 1 o 0. Menor es mejor; 0.25 equivale a decir siempre 50%."],
  light: ["Semáforo", "Verde: modelo + guion + cuota con datos completos. Amarillo: hay edge pero falta información o hay alertas. Gris: sin edge (no bet)."],
  gate: ["Gate de completitud", "Regla 9.3: si falta un dato obligatorio (lesiones, alineación, clima, 2+ casas), ningún pick puede ser Verde."],
  leak: ["Fuga de datos", "Usar información que no existía antes del partido. Hace que el modelo parezca mejor de lo que es; por eso se filtra todo por fecha."],
  depth: ["Depth chart", "Alineación que publica cada equipo durante la semana: quién es titular (1) y suplente (2, 3) en cada posición. Es proyectada, no confirmada."],
  injury: ["Reporte de lesiones", "Estados oficiales: Out (no juega), Doubtful (duda seria), Questionable (puede jugar). Se publica de miércoles a viernes."],
  pfr: ["PFR", "Pro Football Reference: fuente de estadísticas avanzadas de defensa (presiones, blitz, tackles fallados) publicada en nflverse."],
  nflverse: ["nflverse", "Proyecto abierto de datos de la NFL: resultados, play-by-play con EPA, rosters, lesiones y más. Es la fuente principal de DATAGSPORTS."],
  h2h: ["H2H", "Head to head: enfrentamientos directos entre los dos equipos."],
  pfpa: ["PF / PA", "Puntos a favor y puntos en contra."],
  quarters: ["1Q / 1H", "Primer cuarto y primera mitad. Mercados tempranos equivalentes a F3/F5 del framework de MLB."],
  positions: ["Posiciones", "QB mariscal · RB corredor · WR receptor · TE ala cerrada · T/G/C línea ofensiva · DT/DE línea defensiva · LB apoyador · CB esquinero · S profundo."],
  divergence: ["Divergencia", "Diferencia entre el método más optimista y el más pesimista. Hasta 5 pp: confianza alta; hasta 10: media; más de 10: baja."],
  confidence: ["Confianza", "Qué tanto coinciden los métodos independientes; no es la probabilidad de acertar."],
};

function annotate(text) {

  for (const [token, key] of AUTO_TERMS) {
    if (used.has(key)) continue;
    const re = new RegExp(`(^|[^\\p{L}\\p{N}/])(${escRe(esc(token))})(?![\\p{L}\\p{N}])`, "u");
    if (!re.test(out)) continue;
    out = out.replace(re, (_m, pre, tok) => {
      marks.push(`${tok}${info(key)}`);
      return `${pre}\u0001${marks.length - 1}\u0001`;
    });
    used.add(key);
  }
  return out.replace(/\u0001(\d+)\u0001/g, (_m, i) => marks[Number(i)]);
}

let popoverEl = null;
function ensurePopover() {
  if (popoverEl) return popoverEl;
  popoverEl = document.createElement("div");
  popoverEl.className = "bubble";
  popoverEl.id = "term-bubble";
  popoverEl.setAttribute("role", "dialog");
  popoverEl.hidden = true;
  document.body.appendChild(popoverEl);
  return popoverEl;
}
function openTerm(btn) {
  const g = GLOSSARY[btn.dataset.term];
  if (!g) return;
  const el = ensurePopover();
  el.innerHTML = `<strong>${esc(g[0])}</strong><p>${esc(g[1])}</p>`;
  el.hidden = false;
  const r = btn.getBoundingClientRect();
  const w = Math.min(320, window.innerWidth - 24);
  el.style.width = `${w}px`;
  const left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + r.width / 2 - w / 2));
  const below = r.bottom + 10 + el.offsetHeight < window.innerHeight;
  el.style.left = `${left}px`;
  el.style.top = `${below ? r.bottom + 10 : r.top - el.offsetHeight - 10}px`;
  el.dataset.side = below ? "below" : "above";
  el.style.setProperty("--tail", `${r.left + r.width / 2 - left}px`);
  document.querySelectorAll(".info[aria-expanded='true']").forEach((b) => b.setAttribute("aria-expanded", "false"));
  btn.setAttribute("aria-expanded", "true");
}
function closeTerm() {
  if (popoverEl) popoverEl.hidden = true;
  document.querySelectorAll(".info[aria-expanded='true']").forEach((b) => b.setAttribute("aria-expanded", "false"));
}
document.addEventListener("click", (evt) => {
  const btn = evt.target.closest?.(".info");
  if (btn) {
    evt.preventDefault();
    evt.stopPropagation();
    if (btn.getAttribute("aria-expanded") === "true") closeTerm();
    else openTerm(btn);
  } else if (!evt.target.closest?.("#term-bubble")) closeTerm();
});
document.addEventListener("keydown", (evt) => { if (evt.key === "Escape") closeTerm(); });

const RATING_ROWS = [
  { key: "weightCurrent", label: "Peso de la temporada actual", fmt: (v) => pct(v, 0), higher: null },
  { key: "off", label: "Ofensiva: puntos por partido (regresada)", fmt: (v) => v.toFixed(1), higher: true },
  { key: "def", label: "Defensa: puntos permitidos (regresada)", fmt: (v) => v.toFixed(1), higher: false },
  { key: "elo", label: "Elo", fmt: (v) => String(v), higher: true },
  { key: "offEpa", label: "EPA/jugada ofensiva", fmt: (v) => signed(v, 3), higher: true, rank: "offEpaRank" },
  { key: "defEpa", label: "EPA/jugada permitido", fmt: (v) => signed(v, 3), higher: false, rank: "defEpaRank" },
];
function ratingDelta(row, before, now) {
  const d = now - before;
  if (Math.abs(d) < 1e-9) return `<span class="delta flat">= sin cambio</span>`;
  const good = row.higher === null ? null : (d > 0) === row.higher;
  const cls = good === null ? "flat" : good ? "up" : "down";
  const txt = row.key === "weightCurrent" ? `${d > 0 ? "+" : "−"}${Math.abs(d * 100).toFixed(0)} pp` : row.key === "elo" ? signed(d, 0) : row.key.endsWith("Epa") ? signed(d, 3) : signed(d, 1);
  return `<span class="delta ${cls}">${d > 0 ? "▲" : "▼"} ${txt}${good === null ? "" : good ? " mejor" : " peor"}</span>`;
}
function changesTable(prev, a) {
  const t = FOCUS.team;
  const p0 = prev.ratings?.[t], p1 = a.ratings?.[t];
  if (!p0 || !p1) return "";
  const rows = RATING_ROWS.map((r) => `<tr><td>${annotate(r.label)}</td><td class="r num">${r.fmt(p0[r.key])}${r.rank ? ` <span class="muted">(${p0[r.rank]}º)</span>` : ""}</td><td class="r num">${r.fmt(p1[r.key])}${r.rank ? ` <span class="muted">(${p1[r.rank]}º)</span>` : ""}</td><td>${ratingDelta(r, p0[r.key], p1[r.key])}</td></tr>`);
  if (p0.qb && p1.qb && p0.qb.name === p1.qb.name) rows.push(`<tr><td>${annotate(`ANY/A de ${p1.qb.name}`)}</td><td class="r num">${p0.qb.anya.toFixed(2)}</td><td class="r num">${p1.qb.anya.toFixed(2)}</td><td>${ratingDelta({ key: "anya", higher: true }, p0.qb.anya, p1.qb.anya)}</td></tr>`);
  const pr = prev.postgame;
  return `
    <p class="note">Ratings de ${esc(t)} en el análisis de la ${esc(weekLabel(prev.week, true))} (${esc(prev.baseLabel ?? String(prev.season - 1))}) y en este (${esc(a.baseLabel ?? "")}).${pr ? ` Entre los dos entró el partido ${esc(prev.away)} ${pr.awayScore} – ${pr.homeScore} ${esc(prev.home)}.` : ""}</p>
    <div class="table-scroll"><table class="compact"><thead><tr><th>Dato de ${esc(t)}</th><th class="r">${esc(weekLabel(prev.week, true))}</th><th class="r">${esc(weekLabel(a.week, true))}</th><th>Cambio</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function changesSummary(prev, a) {
  const t = FOCUS.team;
  const p0 = prev.ratings?.[t], p1 = a.ratings?.[t];
  if (!p0 || !p1) return "";
  const opp = a.home === t ? a.away : a.home;
  const o1 = a.ratings?.[opp];
  const parts = [`Los partidos de ${a.season} ya pesan ${pct(p1.weightCurrent, 0)} en los ratings de ${t}${o1 ? ` y ${pct(o1.weightCurrent, 0)} en los de ${opp}` : ""}.`];
  parts.push(`La ofensiva de ${t} pasó de ${p0.off.toFixed(1)} a ${p1.off.toFixed(1)} puntos esperados y la defensa de ${p0.def.toFixed(1)} a ${p1.def.toFixed(1)} permitidos; su Elo de ${p0.elo} a ${p1.elo}.`);
  if (p0.defEpaRank !== p1.defEpaRank || p0.offEpaRank !== p1.offEpaRank) parts.push(`En EPA por jugada: ofensiva ${p0.offEpaRank}º → ${p1.offEpaRank}º, defensa ${p0.defEpaRank}º → ${p1.defEpaRank}º.`);
  return parts.join(" ");
}
function evolutionPanel() {

  if (!list.length) return "";
  const pFocus = (a) => (a.home === t ? a.pHome : 1 - a.pHome);
  const mFocus = (a) => { const m = marketImpliedHome(a); return m === null ? null : a.home === t ? m : 1 - m; };
  const rows = list.map((a) => {

  });
  const played = rows.filter((r) => r.pg);

const MODEL_NAMES = { framework: "Framework (λ + triangulación)", elo: "Elo (FiveThirtyEight)", kalman: "Kalman ofensiva/defensa", ridge: "Ridge de puntos", epa: "EPA ajustada por rival", ensemble: "Ensamble (Hedge)", qv: "+ valor de QB", qb: "+ cambio de QB", final: "Final: + bajas y clima medidos", market: "Mercado (cierre)" };
const MODEL_COLORS = { framework: "var(--c8)", elo: "var(--c2)", kalman: "var(--c7)", ridge: "var(--c4)", epa: "var(--c5)", ensemble: "var(--c1)", qv: "var(--c6)", qb: "var(--muted)", final: "var(--accent)", market: "var(--ink)" };

/** Coloca etiquetas al final de las líneas sin que se encimen (separación mínima gap, dentro de [top, bottom]). */
function spreadLabels(items, gap, top, bottom) {
  const sorted = [...items].sort((a, b) => a.y - b.y);
  for (let i = 1; i < sorted.length; i++) sorted[i].y = Math.max(sorted[i].y, sorted[i - 1].y + gap);
  const over = sorted.length ? sorted[sorted.length - 1].y - bottom : 0;
  if (over > 0) for (const it of sorted) it.y -= over;
  for (let i = sorted.length - 2; i >= 0; i--) sorted[i].y = Math.min(sorted[i].y, sorted[i + 1].y - gap);
  if (sorted.length && sorted[0].y < top) { const d = top - sorted[0].y; for (const it of sorted) it.y += d; }
  return new Map(sorted.map((it) => [it.k, it.y]));
}
/** Marcas del eje de semanas: cada 3 de temporada regular y una sola marca "PO" para playoffs. */
function weekTicks(weeks) {
  const out = [];
  weeks.forEach((w, i) => {
    if (i && w === weeks[i - 1]) return;
    if (w <= 18 && (w % 3 === 1)) out.push({ i, label: `S${w}` });
    if (w === 19) out.push({ i, label: "PO" });
  });
  return out;
}

      </div>
    </div>

    <div class="fw-list">
    ${sectionBlock(a, sec("1"), grouped("1"))}

    ${sectionBlock(a, sec("2"), `
      ${grouped("2")}
      ${group("Últimos partidos y enfrentamientos directos", `
        <div class="two-col">

    ${sectionBlock(a, sec("3"), `
      ${grouped("3")}
      ${group("Últimos 5 partidos de cada QB", `<div class="two-col">${qbTable(a.home)}${qbTable(a.away)}</div><p class="note">Contexto: el framework no les da más peso que a la temporada completa (3.3).</p>`, { icon: "⟲", open: false })}
      ${formulaCards(a, "3")}`)}

    ${sectionBlock(a, sec("4"), `
      ${grouped("4")}
      ${group("Bajas: reporte de lesiones e inactivos oficiales", `
        <div class="table-scroll"><table class="compact">
          <thead><tr><th>Jugador</th><th>Equipo</th><th>Pos ${info("positions")}</th><th>Estado</th><th>Lesión</th><th>Publicado</th><th>¿Inactivo oficial? ${info("inactive")}</th><th>¿Titular esta semana?</th><th>¿Titular en la base?</th></tr></thead>
          <tbody>${a.injuries.map((i) => `<tr><td>${esc(i.name)}</td><td>${esc(i.team)}</td><td>${esc(i.position ?? "—")}</td><td>${esc(i.status)}</td><td class="muted">${esc(i.injury ?? "—")}</td><td class="muted">${i.date ? esc(fmtDate(i.date)) : "—"}</td><td>${i.inactive ? '<span class="pill no">Sí, no juega</span>' : '<span class="pill muted">No</span>'}</td><td>${i.starterNow ? "Sí" : "No"}</td><td>${i.inBase ? "Sí" : `No (${i.baseWeeks} sem.)`}</td></tr>`).join("") || `<tr><td colspan="9" class="muted">Sin bajas reportadas.</td></tr>`}</tbody>
        </table></div>
        ${pg && pg.injuredLate.length ? cloud("warn", "Excluido por fuga de datos", `<p>${esc(pg.injuredLate.join("; "))}: publicado después del inicio del partido.${info("leak")}</p>`, "!") : ""}`, { icon: "✚", count: a.injuries.length, open: false })}`)}

    ${sectionBlock(a, sec("5"), `
      ${a.models ? group("Torneo de modelos: un modelo nuevo para este partido", tournamentBlock(a), { icon: "⚑" }) : ""}
      ${prevId ? group(`Qué cambió desde el análisis de la ${weekLabel(PRE[prevId].week, true)}`, changesTable(PRE[prevId], a), { icon: "↻" }) : ""}
      ${grouped("5")}
      ${group("Proyección de puntos", `
