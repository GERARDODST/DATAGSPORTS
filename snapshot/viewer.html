          <span class="flow-arrow" aria-hidden="true">→</span>

          ${a.projectionFramework ? `<span class="flow-arrow" aria-hidden="true">→</span>
          <div class="proj-box"><span class="eyebrow">λ del framework</span><span class="num">${esc(a.away)} ${a.projectionFramework.away.toFixed(1)} · ${esc(a.home)} ${a.projectionFramework.home.toFixed(1)}</span></div>` : ""}
          <span class="flow-arrow" aria-hidden="true">→</span>
          <div class="proj-box strong"><span class="eyebrow">${a.models ? "Modelo final (ensamble)" : "λ final"}</span><span class="num">${esc(a.away)} ${a.projection.away.toFixed(1)} · ${esc(a.home)} ${a.projection.home.toFixed(1)}</span></div>
        </div>
        <p class="note">Total ${a.projection.total.toFixed(1)} (línea ${c.total ?? "—"}) · margen ${signed(a.projection.margin, 1)} para ${esc(a.home)} (mercado: ${esc(favTeam)} por ${Math.abs(c.spread)}).</p>`, { icon: "λ" })}
      ${group("Ajustes de la tabla 5.3 (sin contar doble)", `
        <div class="adj-list">${a.adjustments.map((x) => `
          <div class="adj ${x.applied ? "applied" : x.met && x.inBase ? "inbase" : ""}">
            <div class="adj-head"><strong>${annotate(x.condition)}</strong><span class="num">×${x.factor.toFixed(2)}</span></div>
            <div class="muted">${esc(x.data)}</div>
            <div class="adj-tags">
              ${x.met === null ? '<span class="pill no">? Sin dato</span>' : x.met ? '<span class="pill warn">Se cumple</span>' : '<span class="pill muted">No se cumple</span>'}
              ${x.inBase ? '<span class="pill derived">Ya está en la base</span>' : '<span class="pill muted">Información nueva</span>'}
              ${x.applied ? '<span class="pill ok">✓ Aplicado</span>' : ""}
              ${x.replaced ? '<span class="pill derived">↺ Reemplazado por el efecto medido</span>' : ""}
            </div>
            ${x.met && x.inBase ? `<div class="m-note">${esc(x.reason)}</div>` : ""}
            ${x.measured ? `<div class="m-note">${esc(x.measured)}</div>` : ""}
          </div>`).join("")}</div>`, { icon: "×", count: a.adjustments.length, open: false })}
      ${group(a.models ? "Probabilidad por método: framework, torneo y mercado" : "Triangulación de la probabilidad", `<div class="chart-wrap">${probabilityChart(a, marketHome)}</div><p class="note">Divergencia ${(a.divergence * 100).toFixed(1)} pp → confianza ${esc(a.confidence)}${info("divergence")}</p>`, { icon: "△" })}
      ${group(a.models ? "Distribución del margen del modelo final (mezcla de normales)" : "50,000 partidos simulados (Monte Carlo)", `
        <div class="legend"><span><i class="dot" style="background:var(--s1)"></i>Gana ${esc(a.home)}</span><span><i class="dot" style="background:var(--s2)"></i>Gana ${esc(a.away)}</span></div>
        <div class="chart-wrap">${marginChart(a)}</div>
        <p class="readout" id="margin-readout">Pasa el cursor (o toca) sobre la distribución para ver la probabilidad de cada margen.</p>
        ${a.models?.discrete ? cloud("take", "Números clave incluidos", `<p>Las barras son la distribución discreta del modelo final: cada margen entero pesa según qué tan seguido ocurrió en 2019–2023 frente a lo que predice una curva normal (el 3 pasa ~2.7 veces más, el 7 ~1.8). Por eso sobresalen 3, 7 y 10, y el ${annotate("Push")}${info("push")} sobre una línea entera tiene su propia probabilidad.</p>`, "✓") : cloud("warn", "Limitación", `<p>La distribución es continua y no captura que los márgenes se amontonan en 3 y 7. Con un spread de 3, el ${annotate("Push")}${info("push")} es más probable de lo que el modelo cree.</p>`, "!")}`, { icon: "∿", open: false })}
      ${formulaCards(a, "5")}`)}

    ${sectionBlock(a, sec("6"), `
      ${grouped("6")}
      ${group("Desarrollo por tramos", `
        <div class="summary-cards">
          <div class="sum-card" style="--cat:var(--c6)"><span class="eyebrow">1er cuarto</span><span class="num big">${a.projection.q1.away.toFixed(1)} – ${a.projection.q1.home.toFixed(1)}</span><span class="muted">${esc(a.away)} – ${esc(a.home)}</span></div>
          <div class="sum-card" style="--cat:var(--c6)"><span class="eyebrow">1ra mitad</span><span class="num big">${a.projection.h1.away.toFixed(1)} – ${a.projection.h1.home.toFixed(1)}</span><span class="muted">${esc(a.away)} – ${esc(a.home)}</span></div>
          <div class="sum-card" style="--cat:var(--c6)"><span class="eyebrow">Final</span><span class="num big">${a.projection.away.toFixed(1)} – ${a.projection.home.toFixed(1)}</span><span class="muted">${esc(a.away)} – ${esc(a.home)}</span></div>
        </div>`, { icon: "◔" })}
      ${group("Tabla de decisiones por línea (6.10)", `
        <div class="line-bars">${a.lineTable.map((l) => `
          <div class="line-row ${l.line === c.total ? "market" : ""}">
            <span class="num">${l.line}${l.line === c.total ? " · mercado" : ""}</span>
            <div class="split" role="img" aria-label="Over ${pct(l.pOver)}${l.pPush ? `, push ${pct(l.pPush)}` : ""}, Under ${pct(l.pUnder)}"><span class="over" style="flex:${l.pOver}">Over ${pct(l.pOver, 0)}</span>${l.pPush ? `<span class="pushseg" style="flex:${Math.max(l.pPush, 0.04)}" title="Push ${pct(l.pPush)}">${pct(l.pPush, 0)}</span>` : ""}<span class="under" style="flex:${l.pUnder}">Under ${pct(l.pUnder, 0)}</span></div>
            <span class="muted">${esc(l.read)}</span>
          </div>`).join("")}</div>`, { icon: "⇅" })}
      ${formulaCards(a, "6")}`)}

    ${sectionBlock(a, sec("7"), `
      ${grouped("7")}
      ${group("Valor por mercado", `<div class="market-cards">${a.markets.map((m) => `
        <div class="market-card">
          <div class="mc-head"><span class="eyebrow">${annotate(m.market)}</span>${lightPill(m.light)}</div>
          <div class="num big">${esc(marketPickLabel(m))} <span class="muted">${fmtOdds(m.odds)}</span></div>
          <div class="prob-compare" role="img" aria-label="Probabilidad implícita ${pct(m.pImplied)} contra modelo ${pct(m.pModel)}">
            <div><span>Mercado ${info("implied")}</span><div class="pbar"><i style="width:${(m.pImplied * 100).toFixed(1)}%;background:var(--s2)"></i></div><b class="num">${pct(m.pImplied)}</b></div>
            <div><span>Modelo</span><div class="pbar"><i style="width:${(m.pModel * 100).toFixed(1)}%;background:var(--s1)"></i></div><b class="num">${pct(m.pModel)}</b></div>
          </div>
          <div class="mc-foot">${m.pPush ? `<span>Push <b class="num">${pct(m.pPush)}</b></span>` : ""}<span>Edge <b class="num ${m.edge > 0 ? "pos" : "negv"}">${signed(m.edge * 100, 1)} pp</b></span><span>Justo ${info("fair")} <b class="num">${fmtOdds(m.fairOdds)}</b></span><span>¼ Kelly ${info("kelly")} <b class="num">${m.kellyQuarter ? pct(m.kellyQuarter) : "—"}</b></span></div>
        </div>`).join("")}</div>`, { icon: "$" })}
      ${formulaCards(a, "7")}`)}

    ${sectionBlock(a, sec("8"), `
      ${group(`Los ${a.checks.length} filtros de la sección 8.3`, `<ul class="checklist">${a.checks.map((x) => `<li>${checkPill(x.status)}<span><strong>${esc(x.id)} ${annotate(x.rule)}.</strong> ${annotate(x.detail)}</span></li>`).join("")}</ul>`, { icon: "✓", count: a.checks.length })}
      ${group("Dependencia de supuestos (8.2)", `<div class="table-scroll"><table class="compact"><thead><tr><th>Pick</th><th>Supuesto principal</th><th>Si falla</th><th>Riesgo</th></tr></thead>
        <tbody>${a.dependencies.map((d) => `<tr><td>${esc(d.pick)}</td><td>${esc(d.assumption)}</td><td>${esc(d.ifFails)}</td><td>${esc(d.risk)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Sin picks.</td></tr>`}</tbody></table></div>`, { icon: "⛓", open: false })}
      ${group("Decisión corregida (8.4)", `<div class="table-scroll"><table class="compact"><thead><tr><th>Mercado</th><th>Pick</th><th>Modelo</th><th>Guion</th><th>Cuota</th><th>Contradicción</th><th>Semáforo ${info("light")}</th><th>Decisión</th></tr></thead><tbody>${decision}</tbody></table></div>
        ${cloud("explain", "Cómo se decide", "<p>Modelo = edge de al menos 3 pp. Guion = el pick va en la misma dirección que la proyección. Cuota = el momio ofrecido es mejor que el justo. Contradicción = alertas de la auditoría.</p>", "?")}`, { icon: "⚖" })}`)}

    ${sectionBlock(a, sec("9"), `
      ${group("Regla de completitud (9.3)", `<div class="table-scroll"><table class="compact"><thead><tr><th>Sección</th><th>Campos obligatorios</th><th>Estado</th><th>Si falta →</th></tr></thead>
        <tbody>${a.gate.map((g) => `<tr><td>${esc(g.section)}</td><td>${esc(g.label)}</td><td>${g.ok ? '<span class="pill ok">✓ Completo</span>' : '<span class="pill no">✗ Incompleto</span>'}</td><td class="muted">${esc(g.blocks ?? "—")}</td></tr>`).join("")}</tbody></table></div>`, { icon: "⛨" })}
      ${group("Fuentes usadas", `<div class="source-list">${Object.entries(sources).sort((x, y) => y[1] - x[1]).map(([k, n]) => `<div class="source-row"><span class="src">${esc(k)}</span><div class="pbar"><i style="width:${(n / a.inventory.total) * 100}%;background:var(--accent)"></i></div><span class="num">${n}</span></div>`).join("")}</div>`, { icon: "⎘", open: false })}`)}

    ${sectionBlock(a, sec("10"), group("Pasos", `<ol class="steps">${a.algorithm.map((s) => `<li class="${s.status}"><span class="muted">${esc(s.phase)}</span><span>${esc(s.step)}</span>${s.status === "hecho" ? '<span class="pill ok">✓ Hecho</span>' : s.status === "parcial" ? '<span class="pill warn">▲ Parcial</span>' : '<span class="pill no">✗ Falta</span>'}</li>`).join("")}</ol>`, { icon: "⚙" }))}
    </div>

    ${pg ? `
    <section class="panel step" id="resultado" style="border-color:var(--accent)">
      <span class="step-num">Después del partido</span>
      <h2>Resultado real contra el modelo</h2>
      <div class="result-banner">
        <div class="big-proj"><span class="eyebrow">${esc(a.away)}</span><span class="num">${pg.awayScore}</span><span class="dash">—</span><span class="num">${pg.homeScore}</span><span class="eyebrow">${esc(a.home)}</span></div>
        <a href="#g-${esc(gameId)}" style="color:var(--accent-ink);font-weight:600">Ver el partido jugada por jugada →</a>
      </div>
      <div class="metrics">
        <div><span class="num ${pg.winnerCorrect ? "pos" : "negv"}">${pg.winnerCorrect ? "Sí" : "No"}</span><span>¿acertó al ganador? (P = ${pct(a.pHome)} para ${esc(a.home)})</span></div>
        <div><span class="num">${signed(pg.marginError, 1)}</span><span>error en el margen (proyectado − real)</span></div>
        <div><span class="num">${signed(pg.totalError, 1)}</span><span>error en el total</span></div>
        <div><span class="num">${pg.brierModel.toFixed(3)}</span><span>Brier del modelo ${info("brier")}</span></div>
        ${pg.brierMarket !== null ? `<div><span class="num">${pg.brierMarket.toFixed(3)}</span><span>Brier del mercado</span></div>` : ""}
      </div>
      <div class="table-scroll"><table class="compact"><thead><tr><th>Mercado</th><th>Pick</th><th>Semáforo</th><th>Resultado</th></tr></thead>
        <tbody>${a.markets.map((m) => `<tr><td>${esc(m.market)}</td><td>${esc(marketPickLabel(m))}</td><td>${lightPill(m.light)}</td><td>${outcomePill(m)}</td></tr>`).join("")}</tbody></table></div>
      ${cloud("take", "Diagnóstico con los datos", `<ul>${(pg.diagnosis ?? []).map((d) => `<li>${annotate(d)}</li>`).join("")}</ul>`, "✓")}
    </section>` : ""}`;

  attachMarginHover(a);
  view.querySelector(".jump-5")?.addEventListener("click", (evt) => {
    evt.preventDefault();
    const d = document.getElementById("fw-5");
    if (!d) return;
    d.open = true;
    d.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  view.dataset.filter = pregameFilter;
  const applyFilterOpen = () => {
    if (pregameFilter === "todos") return;
    view.querySelectorAll("details.fw").forEach((d) => {
      if (d.querySelector(`[data-status="${pregameFilter}"]`)) {
        d.open = true;
        openSections.add(d.dataset.sec);
        d.querySelectorAll("details.grp").forEach((g) => { if (g.querySelector(`[data-status="${pregameFilter}"]`)) g.open = true; });
      }
    });
  };
  view.querySelectorAll(".fbtn[data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      pregameFilter = btn.dataset.filter;
      view.dataset.filter = pregameFilter;
      view.querySelectorAll(".fbtn[data-filter]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      applyFilterOpen();
    });
  });
  view.querySelectorAll("details.fw").forEach((d) => {
    d.addEventListener("toggle", () => { if (d.open) openSections.add(d.dataset.sec); else openSections.delete(d.dataset.sec); });
  });
  document.getElementById("open-all").addEventListener("click", () => view.querySelectorAll("details.fw").forEach((d) => { d.open = true; }));
  document.getElementById("close-all").addEventListener("click", () => view.querySelectorAll("details.fw").forEach((d) => { d.open = false; }));
}

/* ---------- Navegación ---------- */
let currentRoute = "";
function route() {
  const hash = location.hash.slice(1);
  const match = /^(g|m)-(.+)$/.exec(hash);
  const game = match ? gamesById.get(match[2]) : null;
  const setCurrent = (id, on) => {
    const el = document.getElementById(id);
    if (on) el.setAttribute("aria-current", "page");
    else el.removeAttribute("aria-current");
  };
  const pre = /^p-(.+)$/.exec(hash);
  const isFocus = hash === "chiefs" || Boolean(pre && PRE[pre[1]]);
  setCurrent("nav-lab", hash.startsWith("lab"));
  setCurrent("nav-focus", isFocus);
  setCurrent("nav-home", !hash.startsWith("lab") && !isFocus);
  if (pre && PRE[pre[1]]) {
    renderPregame(pre[1]);
    const pg = gamesById.get(pre[1]);
    document.title = `${pg ? `${pg.away} @ ${pg.home}` : "Análisis"} · modelo previo · DATAGSPORTS`;
  } else if (hash === "chiefs" && FOCUS.team) {
    renderFocusTeam();
    document.title = `${CORE.teams[FOCUS.team]?.name ?? FOCUS.team} · DATAGSPORTS`;
  } else if (hash === "lab") {
    renderLab();
    document.title = "Laboratorio · DATAGSPORTS";
  } else if (hash === "lab-investigacion") {
    renderResearch();
    document.title = "Investigación · Laboratorio · DATAGSPORTS";
  } else if (hash === "lab-modelos") {
    renderModelLab();
    document.title = "Torneo de modelos · Laboratorio · DATAGSPORTS";
  } else if (game) {
    renderGame(game, match[1] === "m" ? "modelo" : "partido");
    document.title = `${game.away} @ ${game.home} · DATAGSPORTS`;
  } else {
    renderHome();
    document.title = "DATAGSPORTS";
  }
}

document.getElementById("season-chip").innerHTML = `Temporada ${CORE.season}<span class="asof"> · datos al ${esc(fmtDate(CORE.generatedAt.slice(0, 10)))}</span>`;
window.addEventListener("hashchange", () => {
  const next = location.hash;
  const sameGame = currentRoute.slice(3) === next.slice(3) && /^#[gm]-/.test(currentRoute) && /^#[gm]-/.test(next);
  currentRoute = next;
  route();
  if (!sameGame) window.scrollTo(0, 0);
});
currentRoute = location.hash;
route();

// Los colores de equipo se eligen según el tema: al cambiar de tema se vuelve a pintar.
const rerender = () => route();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
